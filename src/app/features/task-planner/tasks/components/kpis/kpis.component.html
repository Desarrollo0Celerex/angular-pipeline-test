<div class="row">
    <ng-container *ngFor="let kpi of kpis">
        <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
            <agt-card-kpi
                [kpi]="kpi"
                [selectedContentSubtype]="selectedTaskStatusId"
                (contentSubtypeSelected)="selectTaskStatusId($event)"
            ></agt-card-kpi>
        </div>
    </ng-container>
</div>
