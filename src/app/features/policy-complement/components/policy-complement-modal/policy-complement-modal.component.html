<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content" *ngIf="isInitializedComponent">
            <div class="modal-header">
                <h5 class="modal-title">Complemento de Póliza</h5>
                <button
                    type="button"
                    class="close"
                    (click)="closeModal()"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- AGENTHOS - SMARTWALLET POLICY COMPLEMENT LIST -->
                <div class="row">
                    <div class="col-12 mb-3" *ngIf="canShowAlert">
                        <agt-alert [message]="alertMessage"></agt-alert>
                    </div>
                    <div class="col-md-12">
                        <agt-total-policy-complements
                            [totalPolicyComplements]="policyComplements.length"
                        ></agt-total-policy-complements>
                    </div>
                    <div class="col-md-12">
                        <!-- AGENTHOS - SMARTWALLET POLICY COMPLEMENT UPLOAD -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="closeModal()"
                            (click)="showModalUploadPolicyComplement()"
                        >
                            📑 <strong>CARGAR COMPLEMENTO</strong>
                        </button>
                    </div>
                    <div class="col-md-12 mt-3">
                        <agt-policy-complement-list
                            [policyComplements]="policyComplements"
                            (downloadPolicyComplement)="
                                downloadPolicyComplement($event)
                            "
                            (deletePolicyComplement)="
                                showModalDeletePolicyComplement($event)
                            "
                        ></agt-policy-complement-list>
                    </div>
                </div>
                <!-- //AGENTHOS - SMARTWALLET POLICY COMPLEMENT LIST -->
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    name="agtCancelAction"
                    class="btn btn-block agt-btn-secondary-outline"
                    (click)="closeModal()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>

<agt-upload-policy-complement-modal
    [contactId]="contactId"
    [policyId]="policyId"
    (complementUploaded)="handleComplementUploadedSuccessfully($event)"
></agt-upload-policy-complement-modal>
<agt-download-policy-complement-modal></agt-download-policy-complement-modal>
<agt-delete-policy-complement-modal
    [contactId]="contactId"
    [policyId]="policyId"
    (complementDeleted)="handleComplementDeletedSuccessfully($event)"
></agt-delete-policy-complement-modal>
