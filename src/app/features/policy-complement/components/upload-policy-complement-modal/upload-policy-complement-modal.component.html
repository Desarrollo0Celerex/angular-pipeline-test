<!-- AGENTHOS - SMARTWALLET POLICY COMPLEMENT UPLOAD -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content" *ngIf="isInitializedComponent">
            <div class="modal-header">
                <h5 class="modal-title">Cargar Complemento</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    (click)="closeModal()"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="form" (submit)="validateForm()">
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1">
                            Selecciona el archivo que deseas agregar como
                            complemento.
                        </li>
                    </ol>
                    <div class="row">
                        <div class="col-md-12">
                            <div
                                class="form-group {{
                                    getValidationClass('file')
                                }}"
                            >
                                <input
                                    type="file"
                                    class="dropify"
                                    data-max-file-size="2M"
                                    (change)="selectFile($event)"
                                />
                                <div class="invalid-feedback">
                                    {{ getErrorMessage("file") }}
                                </div>
                            </div>
                            <div class="form-group">
                                <!-- AGENTHOS - TASKPLANNER TASK FILE NAME * -->
                                <label class="form-label"
                                    >Nombre del Complemento</label
                                >
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i
                                                class="fa fa-file-text-o tx-16 lh-0 op-6"
                                            ></i>
                                        </div>
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Ingresa el nombre"
                                        class="form-control {{
                                            getValidationClass('name')
                                        }}"
                                        formControlName="name"
                                    />
                                    <div class="invalid-feedback">
                                        {{ getErrorMessage("name") }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-3">
                            <button
                                type="submit"
                                class="btn btn-block agt-btn-default"
                            >
                                📑 <strong>CARGAR COMPLEMENTO</strong>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    (click)="closeModal()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - SMARWALLET POLICY COMPLEMENT UPLOAD -->
