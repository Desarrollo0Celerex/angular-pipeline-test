<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Seguimiento de Póliza</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="form" (submit)="validateForm()">
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1">
                            Ingresa los detalles para programar el seguimiento.
                        </li>
                    </ol>
                    <div class="row">
                        <div class="col-md-8 col-sm-12">
                            <div class="form-group">
                                <!-- AGENTHOS - SMARTWALLET POLICY WHATSAPP MESSAGE * -->
                                <label class="form-label">Descripción</label>
                                <textarea
                                    class="form-control {{
                                        getValidationClass('message')
                                    }}"
                                    name="agtTaskPlannerTaskDescription"
                                    rows="11"
                                    formControlName="message"
                                ></textarea>
                                <div class="invalid-feedback">
                                    {{ getErrorMessage("message") }}
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-12">
                            <div class="form-group">
                                <!-- AGENTHOS - SMARTWALLET POLICY NUMBER * -->
                                <label class="form-label">No. Poliza</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i
                                                class="fa fa-file-text-o tx-16 lh-0 op-6"
                                            ></i>
                                        </div>
                                    </div>
                                    <input
                                        type="text"
                                        name="agtSmartWalletPolicyNumber"
                                        class="form-control"
                                        [value]="policy?.policyNumber"
                                        disabled=""
                                    />
                                </div>
                            </div>
                            <div class="form-group">
                                <!-- AGENTHOS - SMARTWALLET POLICY INSURER * -->
                                <label class="form-label">Seguro</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i
                                                class="fa fa-institution tx-16 lh-0 op-6"
                                            ></i>
                                        </div>
                                    </div>
                                    <input
                                        type="text"
                                        name="agtSmartWalletPolicyNumber"
                                        class="form-control"
                                        [value]="
                                            policy?.insuranceName | uppercase
                                        "
                                        disabled=""
                                    />
                                </div>
                            </div>
                            <div class="form-group">
                                <!-- AGENTHOS - SMARTWALLET POLICY INSURANCE * -->
                                <label class="form-label">Seguro</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i
                                                class="fa fa-shield tx-16 lh-0 op-6"
                                            ></i>
                                        </div>
                                    </div>
                                    <input
                                        type="text"
                                        name="agtSmartWalletPolicyNumber"
                                        class="form-control"
                                        [value]="
                                            policy?.insuranceName | uppercase
                                        "
                                        disabled=""
                                    />
                                </div>
                            </div>
                            <div class="form-group">
                                <!-- AGENTHOS - SMARTWALLET POLICY INSURANCE * -->
                                <label class="form-label">Prima Total</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i
                                                class="fa fa-dollar tx-16 lh-0 op-6"
                                            ></i>
                                        </div>
                                    </div>
                                    <input
                                        type="text"
                                        name="agtSmartWalletPolicyNumber"
                                        class="form-control"
                                        [value]="
                                            policy?.policyAmount
                                                | currency : '$' : '' : '0.2-2'
                                        "
                                        disabled=""
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-3">
                            <button
                                type="submit"
                                class="btn btn-block agt-btn-default"
                            >
                                📲 <strong>ENVIAR PÓLIZA</strong>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                    (click)="notifyPolicySent()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
