<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar Póliza</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p class="text-justify">
                            <strong>¿Deseas eliminar la póliza?</strong>
                        </p>
                        <p class="text-justify">
                            La póliza será eliminada de forma permanente y no
                            podrá recuperarse.
                            <strong
                                >Por favor confirma si deseas continuar</strong
                            >.
                        </p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-delete"
                            (click)="deletePolicy()"
                        >
                            🗑️ <strong>ELIMINAR PÓLIZA</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>

<agt-policy-actions-deleted-modal></agt-policy-actions-deleted-modal>
