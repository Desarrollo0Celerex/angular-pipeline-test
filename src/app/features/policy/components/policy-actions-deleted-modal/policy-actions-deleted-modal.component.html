<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Acciones Disponibles</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <!-- (JUST IF POLICY DELETED) -->
                    <div class="col-12 mb-3">
                        <div
                            class="alert agt-alert-success alert-dismissible fade show"
                            role="alert"
                        >
                            <span class="alert-inner--icon"
                                ><i class="fe fe-check-circle mr-2"></i
                            ></span>
                            <span class="alert-inner--text"
                                >La póliza se eliminó con éxito.</span
                            >
                        </div>
                    </div>
                    <div class="col-md-12">
                        <ol class="breadcrumb1">
                            <li class="breadcrumb-item1">
                                Selecciona la acción que deseas realizar.
                            </li>
                        </ol>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY LAUNCHER -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="createPolicy()"
                        >
                            🗃️ <strong>CARGAR PÓLIZA</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - DATASUITE REPORT LAUNCHER -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="showReportsModal()"
                        >
                            🚀 <strong>GENERAR REPORTE</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - TASKPLANNER TASK LAUNCHER -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="scheduleTask()"
                        >
                            📆 <strong>PROGRAMAR TAREA</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    name="agtCancelAction"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
