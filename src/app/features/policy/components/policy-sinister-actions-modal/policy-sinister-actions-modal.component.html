<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Siniestros de Póliza</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <!-- (JUST IF POLICY SINISTERS REPORTED) -->
                    <div class="col-md-12 mb-3" *ngIf="totalSinisters > 0">
                        <a
                            data-dismiss="modal"
                            [routerLink]="sinistersRecordRoute"
                        >
                            <agt-alert
                                [message]="alertMessage"
                                [type]="alertType"
                                icon="fe-life-buoy"
                            ></agt-alert>
                        </a>
                    </div>
                    <!-- AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <div class="col-md-12">
                        <ol class="breadcrumb1">
                            <li class="breadcrumb-item1">
                                Selecciona la acción que deseas realizar.
                            </li>
                        </ol>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY SINISTER REPORT -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="createSinister()"
                        >
                            🚨 <strong>REPORTAR SINIESTRO</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY SINISTERS OPEN -->
                        <a [routerLink]="sinistersOpenRoute">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                data-dismiss="modal"
                            >
                                🔔 <strong>SINIESTROS ABIERTOS</strong>
                            </button></a
                        >
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY SINISTERS CLOSED -->
                        <a [routerLink]="sinistersClosedRoute">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                data-dismiss="modal"
                            >
                                🔕 <strong>SINIESTROS CERRADOS</strong>
                            </button></a
                        >
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>

<agt-modal-create-sinister
    [modalId]="modalIdCreateSinister"
    [contactId]="contactId"
    [policyId]="policyId"
    [insuranceId]="policyInsuranceId"
></agt-modal-create-sinister>
