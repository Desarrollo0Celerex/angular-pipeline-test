<!-- AGENTHOS - SMARTWALLET POLICY CHANGE -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cambiar Póliza</h5>
                <button
                    type="button"
                    class="close"
                    aria-label="Close"
                    (click)="closeModal()"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="form" (submit)="validateForm()">
                    <div class="row">
                        <div class="col-md-12">
                            <ol class="breadcrumb1">
                                <li class="breadcrumb-item1">
                                    Selecciona la nueva carátula de la póliza.
                                </li>
                            </ol>
                        </div>
                        <div class="col-md-12">
                            <div
                                [id]="fileContainerId"
                                class="form-group {{
                                    getValidationClass('file')
                                }}"
                            >
                                <input
                                    [id]="fileInputId"
                                    type="file"
                                    class="dropify"
                                    data-height="208"
                                    (click)="$event.preventDefault()"
                                />
                                <input
                                    type="hidden"
                                    name="fileHidden"
                                    formControlName="file"
                                />
                                <div class="invalid-feedback">
                                    {{ getErrorMessage("file") }}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-3">
                            <button
                                type="submit"
                                class="btn btn-block agt-btn-default"
                            >
                                📃 <strong>CAMBIAR PÓLIZA</strong>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    (click)="closeModal()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - SMARWALLET POLICY CHANGE -->

<agt-large-file-uploader
    [maxFileSize]="maxFileSize"
    [allowedFileExtensions]="allowedFileExtensions"
    (fileSelected)="patchFileValue($event)"
    (fileUploaded)="policyUploaded()"
/>
