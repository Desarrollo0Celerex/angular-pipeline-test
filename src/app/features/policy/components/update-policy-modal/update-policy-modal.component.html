<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form [formGroup]="form" (submit)="confirmFile()">
                <div class="modal-header">
                    <h5 class="modal-title">Cambiar Póliza</h5>
                    <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-12">
                            <ol class="breadcrumb1">
                                <li class="breadcrumb-item1">
                                    Selecciona la nueva carátula de la póliza.
                                </li>
                            </ol>
                        </div>
                        <div class="col-md-12">
                            <div
                                class="form-group {{
                                    getValidationClass('file')
                                }}"
                            >
                                <input
                                    type="file"
                                    class="dropify"
                                    data-max-file-size="2M"
                                    (change)="selectFile($event)"
                                />
                                <div class="invalid-feedback">
                                    {{ getErrorMessage("file") }}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-3">
                            <button
                                type="submit"
                                class="btn btn-block agt-btn-default"
                            >
                                📃 <strong>CAMBIAR PÓLIZA</strong>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-block agt-btn-secondary-outline"
                        data-dismiss="modal"
                    >
                        <strong>CANCELAR</strong>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
