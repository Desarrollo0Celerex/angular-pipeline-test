<!-- AGENTHOS - SMARTWALLET POLICY UPDATE -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <!-- AGENTHOS - DETAILS CARD -->
                <h5 class="modal-title">Actualizar Póliza</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <!-- (JUST IF POLICY UPDATED) -->
                    <div class="col-md-12 mb-3" *ngIf="alertMessage">
                        <a
                            [routerLink]="policyTrackerRoute"
                            data-dismiss="modal"
                        >
                            <agt-alert
                                [message]="alertMessage"
                                type="info"
                                icon="fe-edit"
                            ></agt-alert>
                        </a>
                    </div>
                    <!-- //AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <div class="col-md-12">
                        <ol class="breadcrumb1">
                            <li class="breadcrumb-item1">
                                Selecciona la acción que deseas realizar.
                            </li>
                        </ol>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY UPDATE -->
                        <a
                            data-dismiss="modal"
                            [routerLink]="updatePolicyRoute"
                        >
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                            >
                                📝 <strong>ACTUALIZAR DATOS</strong>
                            </button></a
                        >
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY CHANGE -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="updatePolicyFile()"
                        >
                            📃 <strong>CAMBIAR PÓLIZA</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY OWNER CHANGE -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            [disabled]="true"
                        >
                            🪪 <strong>CAMBIAR CONTRATANTE</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    name="agtCancelAction"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - SMARTWALLET POLICY UPDATE -->

<agt-update-policy-file-modal></agt-update-policy-file-modal>
