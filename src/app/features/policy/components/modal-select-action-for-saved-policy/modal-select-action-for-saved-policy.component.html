<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Acciones Disponibles</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-12 mb-3">
                        <div
                            class="alert agt-alert-success alert-dismissible fade show"
                            role="alert"
                        >
                            <span class="alert-inner--icon"
                                ><i class="fe fe-check-circle mr-2"></i
                            ></span>
                            <span class="alert-inner--text"
                                >La póliza se guardó con éxito.</span
                            >
                        </div>
                    </div>
                    <div class="col-12">
                        <ol class="breadcrumb1">
                            <li class="breadcrumb-item1">
                                Selecciona la acción que deseas realizar.
                            </li>
                        </ol>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY PAYMENTS -->
                        <a
                            [routerLink]="routePolicyPendingReceipts"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                        >
                            <i class="fa fa-credit-card-alt mr-2"></i
                            ><strong>APLICAR PAGOS</strong></a
                        >
                    </div>
                    <!-- <div class="col-md-6 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="showModalToSendPolicy()"
                        >
                            <i class="fa fa-send mr-2"></i
                            ><strong>ENVIAR PÓLIZA</strong>
                        </button>
                    </div> -->
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY LAUNCHER -->
                        <a
                            [routerLink]="routePolicyRecord"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                        >
                            <i class="fa fa-file-text mr-2"></i
                            ><strong>VER HISTORIAL</strong>
                        </a>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <a
                    [routerLink]="routeContactPolicies"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </a>
            </div>
        </div>
    </div>
</div>
