<!-- AGENTHOS - SMARTWALLET POLICY REISSUE -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reexpedir Póliza</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <!-- (JUST IF POLICY REISSUED) -->
                    <div class="col-md-12 mb-3" *ngIf="alertMessage">
                        <a
                            [routerLink]="policyTrackerRoute"
                            data-dismiss="modal"
                        >
                            <agt-alert
                                [message]="alertMessage"
                                type="info"
                                icon="fe-repeat"
                            ></agt-alert>
                        </a>
                    </div>
                    <!-- //AGENTHOS - SMARTWALLET POLICY NOTIFICATION -->
                    <div class="col-md-12">
                        <ol class="breadcrumb1">
                            <li class="breadcrumb-item1">
                                Selecciona la acción que deseas realizar.
                            </li>
                        </ol>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY REISSUE PROCESS -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="onReissuePolicy()"
                        >
                            🗂️ <strong>CARGAR REEXPEDICIÓN</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY REISSUE QUOTE -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            [disabled]="true"
                        >
                            📉 <strong>COTIZAR REEXPEDICIÓN</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - PAYTRACKER POLICY REISSUE FOLLOW -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="scheduleFollowUp()"
                        >
                            📆 <strong>AGENDAR SEGUIMIENTO</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <!-- AGENTHOS - CANCEL UPLOAD -->
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - SMARTWALLET POLICY POLICY REISSUE -->

<agt-modal-confirm-reissue-policy
    [modalId]="modalIdConfirmReissuePolicy"
    [contactId]="contactId"
    [policyId]="policyId"
    (actionTypeSelected)="onActionTypeSelected($event)"
></agt-modal-confirm-reissue-policy>
<agt-modal-select-contact-type
    [modalId]="modalIdSelectContactType"
    [actionType]="actionType"
    [contactId]="contactId"
    [policyId]="policyId"
></agt-modal-select-contact-type>
