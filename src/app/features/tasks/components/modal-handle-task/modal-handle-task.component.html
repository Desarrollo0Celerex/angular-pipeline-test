<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Gestionar Tarea</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ol class="breadcrumb1">
                    <li class="breadcrumb-item1">
                        Selecciona la acción que deseas realizar.
                    </li>
                </ol>
                <div class="row">
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - TASKPLANNER TASK FOLLOW -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="showModalSelectCalendar()"
                        >
                            <i class="fa fa-calendar-plus-o mr-2"></i
                            ><strong>SINCRONIZAR CALENDARIO</strong>
                        </button>
                    </div>

                        <button

                            data-dismiss="modal"
                        >
                            <i class="fa fa-inbox mr-2"></i
                            ><strong>CAMBIAR ESTATUS</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <button
                            type="button"
                            name="agtPayTrackerPaymentReminder"
                            class="btn btn-block agt-btn-default"
                            data-toggle="modal"

                            data-dismiss="modal"
                        >
                            <i class="fa fa-share mr-2"></i
                            ><strong>COMPARTIR TAREA</strong>
                        </button>
                    </div> -->
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    name="agtCancelAction"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
