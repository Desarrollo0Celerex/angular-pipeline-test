<ng-container *ngIf="data">
    <div
        class="modal fade"
        [id]="modalId"
        tabindex="-1"
        role="dialog"
        aria-hidden="true"
    >
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Programar Tarea</h5>
                    <a
                        [routerLink]="data.cancelRoute"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close"
                        (click)="reset()"
                    >
                        <span aria-hidden="true">&times;</span>
                    </a>
                </div>
                <div class="modal-body">
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1">
                            Sincroniza la tarea con tu calendario.
                        </li>
                    </ol>
                    <div class="row">
                        <!-- <button
                            type="button"
                            class="btn btn-block agt-btn-apple-calendar mt-3"
                            data-dismiss="modal"
                        >
                            <i class="fa fa-apple mr-2"></i>Apple Calendar
                        </button> -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-google-calendar mt-3"
                            data-dismiss="modal"
                            (click)="selectCalendar(CALENDARS.GOOGLE)"
                        >
                            <i class="fa fa-google mr-2"></i>Google Calendar
                        </button>
                        <button
                            type="button"
                            class="btn btn-block agt-btn-outlook-calendar mt-3"
                            data-dismiss="modal"
                            (click)="selectCalendar(CALENDARS.OUTLOOK)"
                        >
                            <i class="fa fa-envelope mr-2"></i>Outlook Calendar
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <a
                        [routerLink]="data.cancelRoute"
                        class="btn btn-block agt-btn-secondary-outline"
                        data-dismiss="modal"
                        (click)="reset()"
                        ><strong>CANCELAR</strong></a
                    >
                </div>
            </div>
        </div>
    </div>
</ng-container>

<agt-synchronize-task></agt-synchronize-task>
