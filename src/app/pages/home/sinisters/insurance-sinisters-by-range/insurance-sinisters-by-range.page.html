<div class="row">
    <div class="col-12">
        <agt-card-content-title
            title="Siniestros de Autos"
            description="Mostrando siniestros de Autos."
        ></agt-card-content-title>
    </div>
</div>

<div class="row mt-3">
    <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
        <agt-container-select-stats-period
            [statsPeriodData]="statsPeriodData"
            [canShowComparisonPeriod]="false"
            (statsPeriodSelected)="loadContent($event)">
        </agt-container-select-stats-period>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Generar Reporte</h3>
            </div>
            <div class="card-body">
                <ol class="breadcrumb1 mt-2">
                    <li class="breadcrumb-item1">Genera un reporte inmediato de <strong>Siniestros de Auto</strong>.</li>
                </ol>
                <agt-button-download-report-insurance-sinisters
                    *ngIf="!!statsPeriodData && !!insuranceId"
                    [insuranceId]="insuranceId"
                    [rangeField]="rangeField"
                    [rangeStart]="statsPeriodData.startDate"
                    [rangeEnd]="statsPeriodData.endDate"
                    [specialFilter]="specialFilter"
                ></agt-button-download-report-insurance-sinisters>
            </div>
        </div>
    </div>
</div>

<agt-container-filters-insurance-sinisters
    *ngIf="!!statsPeriodData && !!insuranceId"
    [insuranceId]="insuranceId"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    (specialFilterChanged)="applySpecialFilter($event)"
></agt-container-filters-insurance-sinisters>

<agt-content-list
    *ngIf="!!statsPeriodData"
    [contentType]="CONTENT_TYPES.INSURANCE_SINISTERS_BY_RANGE.ID"
    [contentTypeName]="CONTENT_TYPES.INSURANCE_SINISTERS_BY_RANGE.NAME"
    contentSubtypeName="de Autos"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    [contentSpecialFilter]="specialFilter"
    [insuranceId]="insuranceId"
></agt-content-list>
