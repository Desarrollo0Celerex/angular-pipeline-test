<agt-content-kpis
    [contentType]="CONTENT_TYPES.PAYMENT.ID"
    [contentTypeName]="CONTENT_TYPES.PAYMENT.NAME"
    [pageUrl]="pageUrl">
</agt-content-kpis>

<!-- AGENTHOS - LISTING FILTERS  -->
<div class="row mt-5">
    <!-- AGENTHOS - DATA SUITE STATS -->
    <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
        <!-- AGENTHOS - PERIOD FILTERS -->
        <agt-container-select-stats-period
            [statsPeriodData]="statsPeriodData"
            [canShowComparisonPeriod]="false"
            (statsPeriodSelected)="loadContent($event)">
        </agt-container-select-stats-period>
        <!-- //AGENTHOS - PERIOD FILTERS -->
    </div>
    <!-- //AGENTHOS - DATA SUITE STATS -->
    <!-- AGENTHOS - DATA SUITE REPORT -->
    <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
        <agt-card-report-pending-receipts
            *ngIf="!!statsPeriodData"
            [rangeField]="rangeField"
            [rangeStart]="statsPeriodData.startDate"
            [rangeEnd]="statsPeriodData.endDate"
            [specialFilter]="specialFilter"
        ></agt-card-report-pending-receipts>
    </div>
    <!-- //AGENTHOS - DATA SUITE REPORT -->
</div>
<!-- //AGENTHOS - LISTING FILTERS  -->

<agt-container-charts-pending-payments
    *ngIf="!!statsPeriodData"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    (specialFilterChanged)="applySpecialFilter($event)"
></agt-container-charts-pending-payments>

<agt-content-list
    *ngIf="!!statsPeriodData"
    [contentType]="CONTENT_TYPES.PENDING_PAYMENTS_BY_RANGE.ID"
    [contentTypeName]="CONTENT_TYPES.PENDING_PAYMENTS_BY_RANGE.NAME"
    contentSubtypeName="Pendiente"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    [contentSpecialFilter]="specialFilter"
></agt-content-list>
