<div class="row">
    <div class="col-12">
        <agt-card-content-title
            title="Recibos Aplicados"
            description="Mostrando recibos con pago aplicado."
        ></agt-card-content-title>
    </div>
</div>

<!-- AGENTHOS - LISTING FILTERS  -->
<div class="row mt-3">
    <!-- AGENTHOS - DATA SUITE STATS -->
    <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
        <!-- AGENTHOS - PERIOD FILTERS -->
        <agt-container-select-stats-period
            [statsPeriodData]="statsPeriodData"
            [canShowComparisonPeriod]="false"
            (statsPeriodSelected)="loadContent($event)">
        </agt-container-select-stats-period>
        <!-- //AGENTHOS - PERIOD FILTERS -->
    </div>
    <!-- //AGENTHOS - DATA SUITE STATS -->
    <!-- AGENTHOS - DATA SUITE REPORT -->
    <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Generar Reporte</h3>
            </div>
            <!-- AGENTHOS - DATA SUITE REPORT GENERATOR -->
            <div class="card-body">
                <ol class="breadcrumb1 mt-2">
                    <li class="breadcrumb-item1">Genera un reporte inmediato de <strong>Recibos Aplicados</strong>.</li>
                </ol>
                <button type="button" class="btn btn-block btn-primary mt-5" [disabled]="true"><strong>MUY PRONTO</strong></button>
            </div>
            <!-- //AGENTHOS - DATA SUITE REPORT GENERATOR -->
        </div>
    </div>
    <!-- //AGENTHOS - DATA SUITE REPORT -->
</div>
<!-- //AGENTHOS - LISTING FILTERS  -->

<agt-container-charts-receipts-applied
    *ngIf="!!statsPeriodData"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    (specialFilterChanged)="applySpecialFilter($event)"
></agt-container-charts-receipts-applied>

<agt-content-list
    *ngIf="!!statsPeriodData"
    [contentType]="CONTENT_TYPES.RECEIPTS_APPLIED_BY_RANGE.ID"
    [contentTypeName]="CONTENT_TYPES.RECEIPTS_APPLIED_BY_RANGE.NAME"
    contentSubtypeName="Aplicado"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    [contentSpecialFilter]="specialFilter"
></agt-content-list>
