<!-- AGENTHOS - SEARCH RESULTS -->
<div class="row">
    <div class="col-md-12 col-lg-12">
        <agt-content-search-engine [contentType]="contentType" [contentTypeName]="contentTypeName" [query]="query" [totalResults]="totalResults"></agt-content-search-engine>
    </div>
</div>

<agt-content-list
    *ngIf="!!contentType"
    [contentType]="contentType"
    [contentTypeName]="contentTypeName"
    [contentSubtypeName]="contentSubtypeName"
    [query]="query"
    [actionType]="actionType"
    [originContactId]="originContactId"
    [originPolicyId]="originPolicyId"
    (totalResultsLoaded)="onTotalResultsLoaded($event)"
    [canReloadContent]="canReloadContent"
    (contentReloaded)="onContentReloaded()"
    (receiptPaid)="onReloadContent()"
    ></agt-content-list>
<!-- //AGENTHOS - SEARCH RESULTS -->
