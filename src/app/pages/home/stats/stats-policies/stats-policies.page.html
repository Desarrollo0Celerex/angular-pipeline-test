<div class="row mt-5">
	<div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
		<agt-container-select-stats-period (statsPeriodSelected)="loadContent($event)"></agt-container-select-stats-period>
	</div>
	<div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
        <agt-card-report-active-policies
            *ngIf="!!statsPeriodData"
            [rangeStart]="statsPeriodData.startDate"
            [rangeEnd]="statsPeriodData.endDate"
        ></agt-card-report-active-policies>
    </div>
</div>

<div class="row mt-3">
	<div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
		<agt-menu-stats></agt-menu-stats>
	</div>
	<div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
        <div class="row mb-3">
			<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<agt-chart-policies [range]="range"></agt-chart-policies>
            </div>
			<!-- AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<div class="col-xl-9 col-lg-9 col-md-6 col-sm-12">
				<agt-chart-policies-insurances [range]="range"></agt-chart-policies-insurances>
			</div>
			<!-- //AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<!-- AGENTHOS - DATA SUITE LEADS INSIGHTS -->
			<div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
				<div class="card">
					<div class="card-header pt-2 pb-0 border-bottom-0">
						<h3 class="card-title">Insights</h3>
						<div class="card-options">
							<i class="fe fe-trending-up mr-1 text-primary fs-30"></i>
						</div>
					</div>
					<div class="card-body text-center">
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Conoce el desempeño de los <strong>Tipo de<br/>Seguros</strong>.</li>
						</ol>
						<button type="button" class="btn btn-block btn-primary" disabled><strong>MUY PRONTO</strong></button>
					</div>
				</div>
			</div>
			<!-- //AGENTHOS - DATA SUITE LEADS INSIGHTS -->
        </div>
		<agt-container-issued-policies-kpis [range]="range"></agt-container-issued-policies-kpis>

		<!-- AGENTHOS - RENEWAL PROGRESS -->
		<div class="row mb-3">
			<!-- AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<agt-chart-policy-renewal-process
					[range]="range"
				></agt-chart-policy-renewal-process>
			</div>
		</div>
		<!-- AGENTHOS - RENEWAL PROGRESS -->

		<!-- AGENTHOS - DATA SUITE POLICIES APPLIED RENEWALS -->
		<div class="row mb-3">
			<!-- AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<div class="col-xl-9 col-lg-9 col-md-6 col-sm-12">
				<agt-chart-renewed-policies [range]="range"></agt-chart-renewed-policies>
			</div>
			<!-- //AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<!-- AGENTHOS - DATA SUITE LEADS INSIGHTS -->
			<div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
				<div class="card">
					<div class="card-header pt-2 pb-0 border-bottom-0">
						<h3 class="card-title">Insights</h3>
						<div class="card-options">
							<i class="fe fe-trending-up mr-1 text-primary fs-30"></i>
						</div>
					</div>
					<div class="card-body text-center">
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Conoce el<br/>listado de las <strong>Renovaciones<br/>Aplicadas</strong>.</li>
						</ol>
						<button type="button" class="btn btn-block btn-primary" (click)="goToRenewedPoliciesByRange()"><strong>VER DETALLES</strong></button>
					</div>
				</div>
			</div>
			<!-- //AGENTHOS - DATA SUITE LEADS INSIGHTS -->
		</div>
		<!-- //AGENTHOS - DATA SUITE POLICIES APPLIED RENEWALS -->

		<!-- AGENTHOS - DATA SUITE POLICIES RENEWALS -->
		<div class="row mb-3">
			<!-- AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<div class="col-xl-9 col-lg-9 col-md-6 col-sm-12">
				<agt-chart-pending-renovations [range]="range"></agt-chart-pending-renovations>
			</div>
			<!-- //AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<!-- AGENTHOS - DATA SUITE LEADS INSIGHTS -->
			<div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
				<div class="card">
					<div class="card-header pt-2 pb-0 border-bottom-0">
						<h3 class="card-title">Insights</h3>
						<div class="card-options">
							<i class="fe fe-trending-up mr-1 text-primary fs-30"></i>
						</div>
					</div>
					<div class="card-body text-center">
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Conoce el<br/>listado de las <strong>Renovaciones<br/>Pendientes</strong>.</li>
						</ol>
						<button type="button" class="btn btn-block btn-primary" (click)="goToPoliciesToRenew()"><strong>VER DETALLES</strong></button>
					</div>
				</div>
			</div>
			<!-- //AGENTHOS - DATA SUITE LEADS INSIGHTS -->
		</div>
		<!-- //AGENTHOS - DATA SUITE POLICIES RENEWALS -->
		<!-- AGENTHOS - DATA SUITE POLICIES CANCELATIONS -->
		<div class="row mb-3">
			<!-- AGENTHOS - DATA SUITE POLICIES CANCELATIONS -->
			<div class="col-xl-9 col-lg-9 col-md-6 col-sm-12">
				<agt-chart-cancelled-policies [range]="range"></agt-chart-cancelled-policies>
			</div>
			<!-- //AGENTHOS - DATA SUITE POLICIES INSURANCE TYPE -->
			<!-- AGENTHOS - DATA SUITE CANCELATION INSIGHTS -->
			<div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
				<div class="card">
					<div class="card-header pt-2 pb-0 border-bottom-0">
						<h3 class="card-title">Insights</h3>
						<div class="card-options">
							<i class="fe fe-trending-up mr-1 text-primary fs-30"></i>
						</div>
					</div>
					<div class="card-body text-center">
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Conoce el<br/>listado de las <strong>Cancelaciones<br/>Aplicadas</strong>.</li>
						</ol>
						<button type="button" class="btn btn-block btn-primary" (click)="goToCancelledPolicies()"><strong>VER DETALLES</strong></button>
					</div>
				</div>
			</div>
			<!-- //AGENTHOS - DATA SUITE CANCELATIONS INSIGHTS -->
		</div>
		<!-- //AGENTHOS - DATA SUITE POLICIES CANCELATIONS -->
	</div>
</div>
