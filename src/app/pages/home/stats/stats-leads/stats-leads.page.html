<div class="row mt-5">
	<div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
		<agt-container-select-stats-period (statsPeriodSelected)="loadContent($event)"></agt-container-select-stats-period>
	</div>
	<div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
		<div class="card">
			<div class="card-header">
				<h3 class="card-title">Generar Reporte</h3>
			</div>
			<div class="card-body">
				<ol class="breadcrumb1 mt-2">
					<li class="breadcrumb-item1">Genera un reporte inmediato de los <strong>Prospectos Activos</strong>.</li>
				</ol>
				<button type="button" class="btn btn-block btn-primary mt-5" disabled><strong>DESCARGAR REPORTE</strong></button>
			</div>
		</div>
	</div>
</div>
<div class="row mt-3">
	<div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
		<agt-menu-stats></agt-menu-stats>
	</div>
	<div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
		<div class="row">
			<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<agt-chart-generated-leads [range]="model.range"></agt-chart-generated-leads>
			</div>
			<div class="col-xl-9 col-lg-9 col-md-6 col-sm-12">
				<agt-chart-lead-acquisition-channels [range]="model.range"></agt-chart-lead-acquisition-channels>
			</div>
			<div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
				<div class="card">
					<div class="card-header pt-2 pb-0 border-bottom-0">
						<h3 class="card-title">Insights</h3>
						<div class="card-options">
							<i class="fe fe-trending-up mr-1 text-primary fs-30"></i>
						</div>
					</div>
					<div class="card-body text-center">
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Conoce el desempeño de los <strong>Canales de Adquisición</strong>.</li>
						</ol>
						<a [routerLink]="">
							<button type="button" class="btn btn-block btn-primary" disabled><strong>VER DETALLES</strong></button>
						</a>
					</div>
				</div>
			</div>
			<agt-container-lead-channels-kpis [range]="model.range"></agt-container-lead-channels-kpis>
			<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<agt-chart-generated-quotes [range]="model.range"></agt-chart-generated-quotes>
			</div>
			<div class="col-xl-9 col-lg-9 col-md-6 col-sm-12">
				<agt-chart-lead-channels-with-higher-conversion [range]="model.range"></agt-chart-lead-channels-with-higher-conversion>
			</div>
			<div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
				<div class="card">
					<div class="card-header pt-2 pb-0 border-bottom-0">
						<h3 class="card-title">Insights</h3>
						<div class="card-options">
							<i class="fe fe-trending-up mr-1 text-primary fs-30"></i>
						</div>
					</div>
					<div class="card-body text-center">
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Conoce el desempeño del <strong>Funnel de Conversión</strong>.</li>
						</ol>
						<a [routerLink]="">
							<button type="button" class="btn btn-block btn-primary" disabled><strong>VER DETALLES</strong></button>
						</a>
					</div>
				</div>
			</div>
			<agt-container-lead-conversion-kpis [range]="model.range"></agt-container-lead-conversion-kpis>
			<agt-container-lead-partner-kpis [range]="model.range"></agt-container-lead-partner-kpis>
			<agt-container-lead-users-kpis [range]="model.range"></agt-container-lead-users-kpis>
		</div>
	</div>
	<!-- //AGENTHOS - DATA SUITE STATS -->
</div>
<!-- //AGENTHOS - DATA SUITE CONSOLE -->
