<form *ngIf="model.isBuiltForm; else loadingContent" [formGroup]="model.form" (submit)="showModalToConfirmUpdateSite()">    
    <!-- AGENTHOS - SITE CREATOR PREVIEW -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Logo del Sitio Web</h3>
        </div>
        <!-- AGENTHOS - SITE CREATOR CONFIG -->
        <div class="card-body">
            <!-- AGENTHOS - SITE CREATOR COLOR -->
            <div class="row">
                <!-- AGENTHOS - SITE CREATOR MOCKUP -->
                <div class="col-md-12">
                    <agt-device-macbook-pro-site
                        [themeName]="themeName"
                    ></agt-device-macbook-pro-site>
                </div>
                <!-- //AGENTHOS - SITE CREATOR MOCKUP -->
                <!-- AGENTHOS - SITE CREATOR CONFIG -->
                <div class="col-md-12 mt-5">
                    <div class="card">
                        <div class="card-body">
                            <ol class="breadcrumb1">
                                <li class="breadcrumb-item1">Selecciona el logo que deseas para tu Sitio Web.</li>
                            </ol>
                            
                            <div class="col-md-12">
                                <div class="card-body agt-p0 {{getValidationClass('logo')}}">
                                    <input type="file" class="dropify" accept="image/x-png;image/jpeg" data-height="140" (change)="selectLogo($event)" [attr.data-default-file]="logoUrl"/>
                                </div>
                                <div class="invalid-feedback">{{getErrorMessage('logo')}}</div>
                            </div>
                            <div class="col-md-12 mt-3">
                                <div class="card shadow">
                                    <div class="card-body">
                                        <strong>Se recomienda usar una imagen de 440px x 220px para una presentación óptima.</strong>
                                    </div>
                                </div>
                            </div>

                            <!-- AGENTHOS - CONTACT CENTER DETAILS -->
                            <div class="col-md-12 mt-5">
                                <div class="card shadow">
                                    <div class="card-body">
                                        Agenthos usará este logo para crear y desplegar el Sitio Web con tus prospectos y clientes. 
                                    </div>
                                </div>
                            </div>
                            <!-- //AGENTHOS - CONTACT CENTER DETAILS -->
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-12">
                                    <button type="submit" class="btn btn-block agt-btn-primary"><strong>GUARDAR CAMBIOS</strong></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- //AGENTHOS - SITE CREATOR UPDATE -->
                </div>
                <!-- //AGENTHOS - SITE CREATOR CONFIG -->
            </div>
            <!-- //AGENTHOS - SITE CREATOR COLOR -->
        </div>
        <!-- //AGENTHOS - SITE CREATOR CONFIG -->
    </div>
    <!-- //AGENTHOS - SITE CREATOR PREVIEW -->
</form>

<ng-template #loadingContent>
    <agt-loading-content [isLoadingContent]="true" ></agt-loading-content>
</ng-template>

<agt-modal-confirm-update-site 
    [modalId]="modalIdConfirmUpdateSite" 
    (actionConfirmed)="updateSite()"
></agt-modal-confirm-update-site>
