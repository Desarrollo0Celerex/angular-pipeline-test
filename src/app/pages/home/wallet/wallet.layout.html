

<div class="row">
    <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Panel de Control</h3>
                <div class="card-options">
                    <i class="fe fe-settings text-primary fs-30"></i>
                </div>
            </div>
            <div class="card-body">
                <a [routerLink]="ROUTES_NAME.walletResume(walletId)">
                    <button type="button" class="btn btn-block btn-primary" routerLinkActive="agt-button-active"><strong>FICHA DE RESUMEN</strong></button>
                </a>
                <a [routerLink]="ROUTES_NAME.walletIdentity(walletId)">
                    <button type="button" class="btn btn-block btn-primary mt-3" routerLinkActive="agt-button-active"><strong>FICHA DE IDENTIDAD</strong></button>
                </a>
                <a [routerLink]="ROUTES_NAME.walletColors(walletId)">
                    <button type="button" class="btn btn-block btn-primary mt-3" routerLinkActive="agt-button-active"><strong>FICHA DE COLORES</strong></button>
                </a>
                <a [routerLink]="ROUTES_NAME.walletContact(walletId)">
                    <button type="button" class="btn btn-block btn-primary mt-3" routerLinkActive="agt-button-active"><strong>FICHA DE CONTACTO</strong></button>
                </a>
                <button type="button" name="agtAppCreatorChatbot" class="btn btn-block btn-primary mt-3" disabled=""><strong>FICHA DE CHATBOT</strong></button>
            </div>
            <div class="card-footer text-center" *ngIf="!!model.wallet && !!model.wallet.name && !!model.wallet.iconsUrl && !!model.wallet.coveragesPhoneNumberWhatsapp">
                <a [routerLink]="ROUTES_NAME.launchApp(walletId)">
                    <button type="button" class="btn btn-block btn-success"><strong>PUBLICAR APP</strong></button>
                </a>
            </div>
        </div>
    </div>
    <div class="col-xl-8 col-lg-8 col-md-6 col-sm-12">
        <router-outlet></router-outlet>
    </div>
</div>
