<agt-container-policy-details
    [contactId]="contactId"
    [policyId]="policyId">
</agt-container-policy-details>

<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Desempeño de Endosos</h3>
            </div>
        </div>
    </div>
    <agt-alert-unusual-added-endorsements
        [ngStyle]="{'width': '100%'}"
        [contactId]="contactId"
        [policyId]="policyId"
    ></agt-alert-unusual-added-endorsements>
</div>

<div class="row">
    <div class="col-sm-12 col-md-6 col-lg-3 col-xl-3">
        <agt-chart-policy-endorsements
            [contactId]="contactId"
            [policyId]="policyId"
        ></agt-chart-policy-endorsements>
    </div>
    <div class="col-sm-12 col-md-12 col-lg-8 col-xl-9">
        <agt-chart-policy-endorsements-behavior
            [contactId]="contactId"
            [policyId]="policyId"
        ></agt-chart-policy-endorsements-behavior>
    </div>
</div>

<agt-container-policy-endorsements-manager
    [contactId]="contactId"
    [policyId]="policyId">
</agt-container-policy-endorsements-manager>

<agt-content-list
    [contentType]="contentType"
    [contentTypeName]="contentTypeName"
    [contactId]="contactId"
    [policyId]="policyId"
    [contentSubtype]="contentSubtype"
    [contentSubtypeName]="contentSubtypeName">
</agt-content-list>
