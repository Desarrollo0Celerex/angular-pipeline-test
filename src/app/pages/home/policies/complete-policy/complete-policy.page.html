<div class="row">
    <div class="col-md-4">
        <!-- AGENTHOS - POLICY FILE -->

            <div class="card-header">
                <h6 class="mb-0">Carátula de Póliza</h6>
                <div class="card-options">
                </div>
            </div>
            <div class="card-body d-flex">
                <div class="card-order">
                    <h6 class="mb-2">
                        <span class="badge badge-{{completePolicyService.policy.policyStatusBackground}}  mr-1 mb-1 mt-1">{{completePolicyService.policy.policyStatusName | uppercase}}</span>
                    </h6>
                    <h6 class="mb-2">
                        <span class="text-primary"><i class="fe fe-shield mr-2 fs-20"></i></span>{{completePolicyService.policy.insuranceName | uppercase}}
                    </h6>
                    <h6 class="mb-2">
                        <span class="text-primary"><i class="fe fe-file-text mr-2 fs-20"></i></span>{{completePolicyService.policy.insuranceTypeName | uppercase}}
                    </h6>
                </div>
                <div class="ml-auto">
                    <!-- AGENTHOS - INSURANCE TYPE -->
                    <span class="{{completePolicyService.policy.insuranceBackground}} icon-service">
                        <i class="fa {{completePolicyService.policy.insuranceIcon}} fs-2"></i>
                    </span>
                </div>
            </div>
            <div class="card-body">
                <div class="col-sm-12">
                    <!-- AGENTHOS - VIEW POLICY (JUST IF UPLOADED) -->
                    <button type="button" class="btn btn-block btn-primary mb-5" [disabled]="!policyIsLoaded" (click)="onClickShowPolicy()"><strong>VER PÓLIZA</strong></button>
                    <!-- AGENTHOS - UPDATE POLICY -->
                    <a href="new.php">
                        <button type="button" class="btn btn-block btn-secondary" [disabled]="!policyIsLoaded"><strong>ACTUALIZAR PÓLIZA</strong></button>
                    </a>
                </div>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY FILE -->
        <!-- AGENTHOS - POLICY RESUME -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Datos de Póliza</h3>
            </div>
            <div class="card-body">
                <div class="block-content">
                    <div class="form-group row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">Bien Asegurado</label>
                                <input type="text" name="agtAutoGenerated" class="form-control" value="Fernando Pérez Castillo">
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">No. Póliza</label>
                                <input type="text" name="agtAutoGenerated" class="form-control" value="1234589QWERTY">
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">No. Cliente</label>
                                <input type="text" name="agtAutoGenerated" class="form-control" value="1234589QWERTY">
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">Aseguradora</label>
                                <input type="text" class="form-control" placeholder="{{completePolicyService.policy.insurerName | uppercase}}" disabled="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY RESUME -->
    </div>

    <div class="col-md-8">
        <!-- AGENTHOS - POLICY OWNER -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Titular de Póliza</h3>
            </div>
            <div class="card-body">
                <div class="block-content">
                    <div class="form-group row text-center">
                        <div class="col-md-12">
                            <div class="form-group">
                                <!-- AGENTHOS - POLICY NAME * -->
                                <label class="form-label">Nombre del Titular</label>
                                <input type="text" name="agtPolicyName" class="form-control" value="Fernando Perez Castillo">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - POLICY RFC * -->
                                <label class="form-label">RFC</label>
                                <input type="text" name="agtPolicyRfc" class="form-control" value="1234589QWERTY">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - POLICY CP * -->
                                <label class="form-label">Código Postal</label>
                                <input type="text" name="agtPolicyCp" class="form-control" value="1234589QWERTY">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - POLICY PHONE * -->
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="agtPolicyPhone" class="form-control" value="2223456789">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY OWNER -->
        <!-- AGENTHOS - POLICY VALIDITY -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Vigencia de Póliza</h3>
            </div>
            <div class="card-body">
                <div class="block-content">
                    <div class="form-group row text-center">
                        <div class="col-md-4">
                            <!-- AGENTHOS - EMISSION DATE * -->
                            <label class="form-label">Fecha de Emisión</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fe fe-calendar tx-16 lh-0 op-6"></i>
                                    </div>
                                </div>
                                <input class="form-control fc-datepicker" name="agtPolicyEmission" value="08/08/2021" type="text">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <!-- AGENTHOS - VALIDITY INI * -->
                            <label class="form-label">Inicio de Vigencia</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fe fe-calendar tx-16 lh-0 op-6"></i>
                                    </div>
                                </div>
                                <input class="form-control fc-datepicker" name="agtPolicyValidityIni" value="08/08/2021" type="text">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <!-- AGENTHOS - VALIDITY END * -->
                            <label class="form-label">Fin de Vigencia</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fe fe-calendar tx-16 lh-0 op-6"></i>
                                    </div>
                                </div>
                                <input class="form-control fc-datepicker" name="agtPolicyValidityEnd" value="08/08/2021" type="text">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY VALIDITY -->
        <!-- AGENTHOS - POLICY PAYMENT -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Prima de Póliza</h3>
            </div>
            <div class="card-body">
                <div class="block-content">
                    <div class="form-group row text-center">
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - TOTAL PAYMENT * -->
                                <label class="form-label">Prima Total</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i class="fe fe-dollar-sign tx-16 lh-0 op-6"></i>
                                        </div>
                                    </div>
                                    <input type="text" name="agtPayAmount" class="form-control" value="8,888.88">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - PAY CURRENCY * -->
                                <label class="form-label">Moneda</label>
                                <select class="form-control select2 custom-select" name="agtPayCurrency" data-placeholder="Moneda">
                                    <option value="1">MXN</option>
                                    <option value="2">USD</option>
                                    <option value="3">UDIS</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - PAYMENT METHOD * -->
                                <label class="form-label">Forma de Pago</label>
                                <select class="form-control select2 custom-select" name="agtPayMethod" data-placeholder="Forma de Pago">
                                    <option value="1">EFECTIVO</option>
                                    <option value="2">VISA</option>
                                    <option value="3">MASTERCARD</option>
                                    <option value="4">AMEX</option>
                                    <option value="5">TRANSFERENCIA</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - PAY PLAN * -->
                                <label class="form-label">Tipo de Plan</label>
                                <select class="form-control select2 custom-select" name="agtPayPlan" data-placeholder="Tipo de Plan">
                                    <option value="1">PAGO ÚNICO</option>
                                    <option value="2">MENSUAL</option>
                                    <option value="3">TRIMESTRAL</option>
                                    <option value="4">CUATRIMESTRAL</option>
                                    <option value="5">SEMESTRAL</option>
                                    <option value="5">ANUAL</option>
                                </select>
                            </div>
                        </div>
                        <!-- TOTAL TICKETS -->
                        <div class="col-md-4">
                            <div class="form-group">
                                <!-- AGENTHOS - PAY BILLS * -->
                                <label class="form-label">Recibos Totales</label>
                                <input type="text" name="agtPayBills" class="form-control" value="88">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY PAYMENT -->

        <div class="card">
            <div class="card-body">
                <div class="row">

                    </div>
                </div>
            </div>
        </div>
        <!-- //AGENTHOS - UPDATE INFO -->
    </div>
</div>
