<!-- AGENTHOS - PENDING RENEWALS -->
<div class="row">
    <div class="col-12">
        <agt-card-content-title
            title="Renovaciones Pendientes del Contacto"
            description="Mostrando pólizas con renovación pendiente del Contacto."
        ></agt-card-content-title>
    </div>
</div>
<!-- //AGENTHOS - PENDING RENEWALS -->

<div class="row mt-3">
    <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
        <agt-container-select-stats-period
            [statsPeriodData]="statsPeriodData"
            [canShowComparisonPeriod]="false"
            (statsPeriodSelected)="loadContent($event)">
        </agt-container-select-stats-period>
    </div>
    <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
        <agt-card-report-contact-pending-renewals
            *ngIf="!!statsPeriodData"
            [contactId]="contactId"
            [rangeField]="rangeField"
            [rangeStart]="statsPeriodData.startDate"
            [rangeEnd]="statsPeriodData.endDate"
        ></agt-card-report-contact-pending-renewals>
    </div>
</div>

<agt-content-list
    *ngIf="!!statsPeriodData"
    [contentType]="CONTENT_TYPES.CONTACT_PENDING_RENEWALS_BY_RANGE.ID"
    [contentTypeName]="CONTENT_TYPES.CONTACT_PENDING_RENEWALS_BY_RANGE.NAME"
    contentSubtypeName="Pendiente"
    [contactId]="contactId"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
></agt-content-list>
