<agt-container-contact-details [contactId]="contactId" [message]="message"></agt-container-contact-details>

<!-- AGENTHOS - NEW POLICY -->
<div class="row" [hidden]="isLoadingContent">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Seleccionar Archivo</h3>
            </div>
            <!-- AGENTHPS - NEW POLICY BODY -->
            <form [formGroup]="uploadPolicyService.policyForm" (submit)="onSubmitUploadPolicy()">
                <div class="card-body">
                    <div class="row">
                        <!-- AGENTHOS - POLICY ORIGIN -->

                        <div class="col-md-12">
                            <div id="pick">
                                <div class="form-group {{getValidationClass('policyFile')}}">
                                    <input id="dropify" class="form-control dropify" type="file" (click)="blockSelectFile($event)" />
                                    <input type="hidden" name="fileHidden" formControlName="policyFile"/>
                                    <div class="invalid-feedback">{{getErrorMessage('policyFile')}}</div>
                                </div>
                            </div>
                            
                        </div>

                        <!-- <input id="pick" type="button" value="Cargar Archivo"> -->
                        <!-- <div class="col-md-12">
                            <div class="form-group {{getValidationClass('policyFile')}}">
                                <input id="pick" class="form-control dropify" type="button" formControlName="policyFile"/>
                                <div class="invalid-feedback">{{getErrorMessage('policyFile')}}</div>
                            </div>
                        </div> -->
                        <div class="col-md-12">
                            <!-- AGENTHOS - INSURANCE COMPANY -->
                            <div class="form-group">
                                <label class="form-label">Compañía de Seguros</label>
                                <select [id]="searchIdInsurers" class="form-control select2-show-search custom-select {{getValidationClass('insurerId')}}" data-placeholder="Compañía Aseguradora" formControlName="insurerId">
                                    <optgroup label="Seleccionar Compañía">
                                        <option [value]="insurer.insurerId" *ngFor="let insurer of uploadPolicyService.insurers">{{insurer.name | uppercase}}</option>
                                    </optgroup>
                                </select>
                                <div class="invalid-feedback">{{getErrorMessage('insurerId')}}</div>
                            </div>
                            <!-- //AGENTHOS - INSURANCE COMPANY -->
                        </div>
                        <!-- //AGENTHOS - POLICY ORIGIN -->

                        <!-- AGENTHOS - CONFIRM POLICY -->
                        <div class="col-md-12 mt-5">
                            <button type="submit" class="btn btn-primary btn-block"><strong>CARGAR PÓLIZA</strong></button>
                        </div>
                        <!-- //AGENTHOS - CONFIRM POLICY -->
                    </div>
                </div>
            </form>
            <!-- AGENTHOS - NEW POLICY BODY -->
            <!-- AGENTHOS - NEW POLICY FOOTER -->
            <div class="card-footer">
                <div class="row">
                    <div class="col-md-12">
                        <a routerLink="/{{ROUTES_NAME.listContactPolicies(contactId)}}">
                        <button type="button" name="agtCancelAction" class="btn btn-secondary btn-block"><strong>CANCELAR</strong></button></a>
                    </div>
                </div>
            </div>
            <!-- //AGENTHOS - NEW POLICY FOOTER -->
        </div>
    </div>
</div>
<!-- //AGENTHOS - NEW POLICY -->

<agt-file-uploader
    #fileUploader
    [contactId]="contactId"
    [policyId]="policyId"
    [extensions]="allowedFileTypes"
    (fileSelected)="setPolicyFile($event)"
></agt-file-uploader>
<agt-loading-content [isLoadingContent]="isLoadingContent"></agt-loading-content>
