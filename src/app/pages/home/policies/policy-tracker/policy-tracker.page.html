<agt-container-policy-details
    [contactId]="contactId"
    [policyId]="policyId">
</agt-container-policy-details>

<!-- AGENTHOS - POLICY INSIGHTS HEADER -->
<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <!-- AGENTHOS - POLICY INSIGHTS TITLE -->
            <div class="card-header">
                <h3 class="card-title">Desempeño de Renovaciones</h3>
            </div>
            <!-- AGENTHOS - TRACKER CONTROL HEADER -->
        </div>
    </div>
    <div class="col-12">
        <agt-alert-unusual-policy-increase
            [contactId]="contactId"
            [policyId]="policyId"
        ></agt-alert-unusual-policy-increase>
    </div>
</div>
<!-- //AGENTHOS - POLICY INSIGHTS HEADER -->

<!-- AGENTHOS - POLICY INSIGHTS -->
<div class="row">
    <!-- AGENTHOS - POLICY TRACKER INSURERS -->
    <div class="col-sm-12 col-md-12 col-lg-4 col-xl-3">
        <agt-chart-policy-tracker-insurers
            [contactId]="contactId"
            [policyId]="policyId"
        ></agt-chart-policy-tracker-insurers>
    </div>
    <!-- //AGENTHOS - POLICY TRACKER INSURERS -->
    <!-- AGENTHOS - POLICY LIFETIME AMOUNTS -->
    <div class="col-sm-12 col-md-12 col-lg-8 col-xl-9">
        <div class="card">
            <div class="card-header pt-2 pb-0 border-bottom-0">
                <h3 class="card-title">Comportamiento de Primas</h3>
                <div class="card-options">
                    <i data-toggle="popover" data-placement="left" class="fe fe-help-circle fs-20 text-primary" data-content="Comportamiento de primas en las renovaciones de la póliza." data-original-title="" title=""></i>
                </div>
            </div>
            <!-- AGENTHOS - PROFILE GLOBAL PROTECTION -->
            <div id="agtPolicyTrackerAmounts"></div>
        </div>
    </div>
    <!-- //AGENTHOS - POLICY LIFETIME AMOUNTS -->
</div>
<!-- //AGENTHOS - POLICY INSIGHTS -->

<agt-container-policy-tracker-manager
    [contactId]="contactId"
    [policyId]="policyId">
</agt-container-policy-tracker-manager>

<agt-content-list
    [contentType]="CONTENT_TYPES.POLICY_TRACKER.ID"
    [contentTypeName]="CONTENT_TYPES.POLICY_TRACKER.NAME"
    [contactId]="contactId"
    [policyId]="policyId"
    [contentSubtype]="DEFAULT_CONTENT_FILTER_ID"
    contentSubtypeName="Enlazada">
</agt-content-list>
