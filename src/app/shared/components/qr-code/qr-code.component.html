<ng-container *ngIf="link; else loading">
    <ngx-qrcode
        [elementType]="ngxElementType"
        [errorCorrectionLevel]="ngxCorrectionLevel"
        [value]="link"
    ></ngx-qrcode>
</ng-container>

<ng-template #loading>
    <agt-loading-content
        [isLoadingContent]="true"
        [height]="height"
    ></agt-loading-content>
</ng-template>
