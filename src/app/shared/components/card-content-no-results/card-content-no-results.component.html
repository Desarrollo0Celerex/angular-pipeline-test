<div class="card">
    <div class="card-body">
        <ol class="breadcrumb1">
            <li class="breadcrumb-item1">
                {{ message }} <strong>{{ details }}</strong>
            </li>
        </ol>
        <ng-container *ngIf="canShowAction">
            <div class="btn-list text-center">
                <button
                    class="btn btn-block agt-btn-primary"
                    (click)="requestDoAction()"
                >
                    <strong>{{ buttonLabel }}</strong>
                </button>
            </div>
        </ng-container>
    </div>
</div>
