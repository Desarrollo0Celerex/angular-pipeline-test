<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form *ngIf="form" [formGroup]="form" (ngSubmit)="validateForm()">
                <div class="modal-header">
                    <h5 class="modal-title">
                        {{ data?.modalTitle | titlecase }}
                    </h5>
                </div>
                <div class="modal-body">
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1">
                            Ingresa los datos para
                            {{ data?.modalMessage | lowercase }}.
                        </li>
                    </ol>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group" *ngIf="canShowInputEmail">
                                <label class="form-label">Correo</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i
                                                class="fa fa-envelope-o tx-16 lh-0 op-6"
                                            ></i>
                                        </div>
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Ingresa el correo"
                                        class="form-control {{
                                            getValidationClass('email')
                                        }}"
                                        formControlName="email"
                                    />
                                    <div class="invalid-feedback">
                                        {{ getErrorMessage("email") }}
                                    </div>
                                </div>
                            </div>
                            <div class="form-group" *ngIf="canShowInputPhone">
                                <label class="form-label">Teléfono</label>
                                <div class="input-group">
                                    <agt-dropdown-phone-codes
                                        [phoneCode]="form.value.phoneCode"
                                        (phoneCodeSelected)="
                                            setPhoneCode($event)
                                        "
                                    ></agt-dropdown-phone-codes>
                                    <input
                                        type="text"
                                        class="form-control {{
                                            getValidationClass('phoneNumber')
                                        }}"
                                        placeholder="Ingresa el Teléfono"
                                        formControlName="phoneNumber"
                                    />
                                    <div class="invalid-feedback">
                                        {{ getErrorMessage("phoneNumber") }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-3">
                            <button
                                type="submit"
                                class="btn btn-block agt-btn-default"
                            >
                                <i class="{{ data?.modalIconClass }} mr-2"></i
                                ><strong>{{
                                    data?.modalActionName | uppercase
                                }}</strong>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        type="button"
                        [routerLink]="data?.modalCancelRoute"
                        class="btn btn-block agt-btn-secondary-outline"
                        data-dismiss="modal"
                    >
                        <strong>CANCELAR</strong>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
