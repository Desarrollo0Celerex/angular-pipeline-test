<!-- AGENTHOS - SELECT FILE -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <!-- AGENTHOS - DETAILS CARD -->
                <h5 class="modal-title">{{ title }}</h5>
                <button
                    type="button"
                    class="close"
                    aria-label="Close"
                    (click)="closeModal()"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ol class="breadcrumb1">
                    <li class="breadcrumb-item1">
                        {{ description }}
                    </li>
                </ol>
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <input
                                type="file"
                                class="dropify-v2"
                                [attr.data-max-file-size]="maxFileSize"
                                (change)="onChangeFile($event)"
                            />
                        </div>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SMARTWALLET POLICY UPDATE -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            [disabled]="!selectedFile"
                            (click)="selectFile()"
                        >
                            <strong>{{ buttonLabel }}</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    (click)="closeModal()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - SELECT FILE -->
