<ng-container *ngIf="kpi">
    <div class="card">
        <div class="card-header border-bottom-0">
            <h6 class="mb-0">
                {{ kpi.contentTypeName }}<br />
                {{ kpi.contentSubtype | paymentStatusName | plural }}
            </h6>
            <ng-container *ngIf="canShowActions">
                <div class="card-options">
                    <button
                        class="btn btn-sm agt-btn-secondary"
                        (click)="selectContentSubtype(kpi.contentSubtype)"
                    >
                        <i class="fe fe-eye mr-2"></i>VER
                    </button>
                </div>
            </ng-container>
        </div>
        <div class="card-body d-flex pt-3 pb-3">
            <div class="text-left">
                <h4 class="mb-1">
                    <span class="number-font"
                        ><span class="counter">{{ kpi.value }}</span></span
                    >
                </h4>
                <p class="text-muted mb-1">
                    <span class="agt-text-success fs-13">
                        <i class="fe fe-trending-up mr-2"></i>
                        {{ percentage | percent }}
                    </span>
                    Sobre el Total
                </p>
            </div>
            <div class="ml-auto">
                <div class="feature">
                    <div
                        class="fa-stack fa-lg fa-2x icon agt-{{
                            kpi.contentSubtype | paymentStatusBackground
                        }}-gradient icon-service"
                    >
                        <i
                            class="mdi {{
                                kpi.contentSubtype | paymentStatusIcon
                            }} fa-stack-1x text-white"
                        ></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-container>
