<div class="card" *ngIf="!!incompletePolicy">
    <!-- AGENTHOS - POLICY HEADER -->
    <div class="card-header">
        <!-- AGENTHOS - POLICY MENU -->
        <div class="card-options">
            <a href="" class="mr-2 text-default" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">
                <span class="fa fa-bars"></span>
            </a>
            <div class="dropdown-menu dropdown-menu-right" role="menu">
                <div class="dropdown-plus-title">Acciones Disponibles</div>
                <!-- AGENTHOS - POLICY COMPLETE -->
                <button type="button" class="dropdown-item" (click)="onClickCompletePolicy()"><i class="fa fa-edit mr-2"></i>Completar</button>
                <div class="dropdown-divider"></div>
                <!-- AGENTHOS - POLICY HISTORY -->
                <button type="button" class="dropdown-item"><i class="fa fa-history mr-2"></i>Historial</button>
                <div class="dropdown-divider"></div>
                <!-- AGENTHOS - POLICY CANCEL -->
                <button type="button" class="dropdown-item" (click)="onClickCancelPolicy()"><i class="fa fa-exclamation-circle mr-2"></i>Cancelar</button>
                <div class="dropdown-divider"></div>
                <!-- AGENTHOS - POLICY DELETE -->
                <button type="button" class="dropdown-item"><i class="fa fa-trash mr-2"></i>Eliminar</button>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY MENU -->
    </div>
    <!-- //AGENTHOS - POLICY HEADER -->
    <!-- AGENTHOS - POLICY BODY -->
    <div class="card-body">
        <!-- AGENTHOS - POLICY COVER -->
        <div class="d-flex clearfix">
            <div class="text-left">
                <!-- AGENTHOS - POLICY STATUS -->
                <div class="badge badge-{{incompletePolicy.policyStatusBackground}} mr-1 mb-3">{{incompletePolicy.policyStatusName | uppercase}}</div>
                <span class="col-auto align-self-center">
                    <span class="form-help" data-toggle="popover" data-placement="top" [attr.data-content]="incompletePolicy.policyStatusDescription" data-original-title="">?</span>
                </span>
                <!-- AGENTHOS - POLICY TYPE -->
                <h6><span class="text-primary"><i class="fe fe-shield mr-2"></i></span>{{incompletePolicy.insuranceName | uppercase}}</h6>
                <!-- AGENTHOS - POLICY PLAN -->
                <h6><span class="text-primary"><i class="fe fe-credit-card mr-2"></i></span></h6>
                <!-- AGENTHOS - POLICY TYPE -->
                <h6><span class="text-primary"><i class="fe fe-globe mr-2"></i></span>{{incompletePolicy.insuranceTypeName | uppercase}}</h6>
                <!-- AGENTHOS - POLICY NUMBER -->
                <h6><span class="text-primary"><i class="fe fe-file-text mr-2"></i></span></h6>
            </div>
            <div class="ml-auto">
                <span class="{{incompletePolicy.insuranceBackground}} icon-service"><i class="fa {{incompletePolicy.insuranceIcon}} fs-2"></i></span>
            </div>
        </div>
        <!-- //AGENTHOS - POLICY COVER -->
        <!-- AGENTHOS - TOTAL PAY -->
        <h6 class="mt-3">Prima Total ()</h6>
        <h6 class="number-font">$<span class="counter">0</span></h6>
        <h6 class="mb-1"></h6>
        <!-- AGENTHOS - POLICY LIFE -->
        <div class="progress progress-sm mt-2">
            <div class="progress-bar travelInsurancePolicy w-0"></div>
        </div>
        <!-- //AGENTHOS - POLICY LIFE -->
    </div>
    <!-- //AGENTHOS - POLICY BODY -->
</div>
