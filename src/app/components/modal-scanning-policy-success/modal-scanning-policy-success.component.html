<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<!-- AGENTHOS - DETAILS CARD -->
				<h5 class="modal-title">Datos Extraidos</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify">Los detalles de la póliza pudieron completarse de manera automática. <strong>Por favor valida que los detalles sean correctos para continuar</strong>.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<div class="col-md-12">
					<button type="button" class="btn btn-block btn-primary" (click)="onClickValidDetails()"><strong>VALIDAR DETALLES</strong></button>
				</div>
			</div>
		</div>
	</div>
</div>
