<!-- AGENTHOS - LAST CONTACTS PANEL -->
<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Últimos Contactos</h3>
            </div>
        </div>
    </div>
    <!-- AGENTHOS - CLIENT CARD -->
    <div *ngFor="let contact of containerLastContactsService.lastContacts" class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
        <agt-card-contact
            [contact]="contact"
            buttonLabel="VER PERFIL"
            (contactSelected)="goToContactProfile($event)"
            (showContactData)="showContactDataModal($event)"
        ></agt-card-contact>
    </div>
    <!-- //AGENTHOS - CLIENT CARD -->
</div>
<!-- //AGENTHOS - LAST CONTACTS PANEL -->
<agt-modal-show-contact-data
    [modalId]="modalIdShowContactData"
    [contactId]="selectedContactId"
></agt-modal-show-contact-data>
