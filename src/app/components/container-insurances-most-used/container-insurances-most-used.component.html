<ng-container *ngIf="model.insurances.length > 0">
    <!-- AGENTHOS - SEGUROS RECOMENDADOS -->
    <div class="row mt-3" id="insuranceSuggestion">
        <div class="col-md-12 col-lg-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Seguros Recomendados</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="alert alert-avatar alert-primary alert-dismissible mb-3">
                <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
                <strong>Business Intelligence</strong> <hr class="message-inner-separator">
                <agt-image-agenthos-assistant></agt-image-agenthos-assistant>
                <p><strong>Predicción:</strong> La {{contentTypeName}} de <strong *ngIf="model.contact !== null">{{model.contact.contactName}}</strong> que deseas cargar en este momento, puede pertenecer a estos ramos.</p>
            </div>
        </div>
        <div class="col-md-3 col-xl-3" *ngFor="let insurance of model.insurances">
            <agt-card-insurance 
                [insurance]="insurance" 
                (insuranceSelected)="selectInsurance($event)"
            ></agt-card-insurance>
        </div>
    </div>
    <!-- //AGENTHOS - SEGUROS RECOMENDADOS -->
</ng-container>
