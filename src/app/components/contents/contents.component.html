<agt-content-kpis
    *ngIf="canShowKpis"
    [contentType]="contentType"
    [contentTypeName]="contentTypeName"
    [contentSubtype]="contentSubtype"
    [canReloadContent]="canReloadContent"
    (contentSubtypeNameSelected)="onContentSubtypeNameSelected($event)">
</agt-content-kpis>
<!-- AGENTHOS - PANEL -->
<div class="row mt-3">
    <div class="col-md-{{searchEngineWidth}} col-lg-{{searchEngineWidth}}">
        <agt-content-search-engine
            [contentType]="contentType"
            [contentTypeName]="contentTypeName"
            [query]="query"
            [contactId]="contactId"
            [policyId]="policyId"
            [groupId]="groupId"
            [partnerId]="partnerId">
        </agt-content-search-engine>
    </div>
    <div class="col-md-{{mainActionWidth}} col-lg-{{mainActionWidth}}">
        <agt-content-main-action
            [contentType]="contentType"
            [contentTypeName]="contentTypeName"
            [contentSubtype]="contentSubtype"
            [contactId]="contactId"
            [policyId]="policyId"
            [groupId]="groupId"
            (contentSubtypeNameSelected)="onContentSubtypeNameSelected($event)"
            (groupCreated)="reloadIncompleteGroupsPage()"
            (paymentSelected)="applyPayment($event)"
            (partnerCreated)="reloadInactivePartnerPage()">
        </agt-content-main-action>
    </div>
</div>
<!-- AGENTHOS - PANEL -->
<agt-content-list
    #contentList
    [contentType]="contentType"
    [contentTypeName]="contentTypeName"
    [contentSubtype]="contentSubtype"
    [contentSubtypeName]="contentSubtypeName"
    [query]="query"
    [contactId]="contactId"
    [policyId]="policyId"
    [groupId]="groupId"
    [partnerId]="partnerId"
    [canReloadContent]="canReloadContent"
    (contentReloaded)="onContentReloaded()"
    (receiptPaid)="onReloadContent()"
></agt-content-list>
