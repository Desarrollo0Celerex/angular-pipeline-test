<!-- AGENTHOS - CONTENT HEADER -->
<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">{{contentTypeName | pluralNameFormat}} {{contentSubtypeName | pluralNameFormat}}</h3>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - CONTENT HEADER -->
<!-- AGENTHOS - CONTENT LIST -->
<div class="row">
    <div class="col-md-3 col-xl-3" *ngFor="let content of contentListService.contents">
        <ng-container [ngSwitch]="contentType">
            <agt-card-lead *ngSwitchCase="CONTENT_TYPES.LEAD.ID" [lead]="content" (showContactData)="onShowContactData($event)"></agt-card-lead>
        </ng-container>
    </div>
</div>
<!-- //AGENTHOS - CONTENT LIST -->

<agt-loading-content [isLoadingContent]="isLoadingContent"></agt-loading-content>
<agt-content-results [isLoadingContent]="isLoadingContent" [contentResultData]="contentListService.contentResultData" [contentTypeName]="contentTypeName" [contentSubtypeName]="contentSubtypeName" (loadMoreContents)="onLoadMoreContents()"></agt-content-results>
<agt-content-suggestions [isLoadingContent]="isLoadingContent" [contentResultData]="contentListService.contentResultData" [contentType]="contentType" [contentTypeName]="contentTypeName"></agt-content-suggestions>

<!-- AGENTHOS - CONTENT ACTIONS -->
<ng-container *ngIf="contentType === CONTENT_TYPES.LEAD.ID">
    <agt-modal-show-contact-data [modalId]="showContactDataModalId" [contactId]="selectedContactId"></agt-modal-show-contact-data>
</ng-container>
<!-- //AGENTHOS - CONTENT ACTIONS -->
