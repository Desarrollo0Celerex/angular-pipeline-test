<agt-container-external-policies *ngIf="contentType === CONTENT_TYPES.CONTACT_POLICY.ID" [contactId]="contactId" [policyStatusId]="contentSubtype" [policyStatusName]="contentSubtypeName"></agt-container-external-policies>
<agt-container-incomplete-policies *ngIf="contentType === CONTENT_TYPES.CONTACT_POLICY.ID" [contactId]="contactId" [contentTypeName]="contentTypeName" (policyDeleted)="onPolicyDeleted()" (showHistoryPolicy)="onShowHistoryPolicy($event)"></agt-container-incomplete-policies>

<!-- AGENTHOS - CONTENT HEADER -->
<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">{{contentTypeName | pluralNameFormat}} {{contentSubtypeName | pluralNameFormat}}</h3>
            </div>
            <div class="card-body" *ngIf="canShowTotalResults">
                <agt-content-total-results [contentType]="contentType" [query]="query" [totalResults]="totalResults" [contactId]="contactId" [policyId]="policyId"></agt-content-total-results>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - CONTENT HEADER -->

<div class="row">
    <!-- AGENTHOS - TIMELINE -->
    <ng-container *ngIf="isHistoryContent; else noHistoryContent">
        <div [class]="cardClasses">
            <ul class="cbp_tmtimeline">
                <ng-container *ngFor="let content of contentListService.contents">
                    <ng-container [ngSwitch]="contentType">
                        <agt-card-policy-record *ngSwitchCase="CONTENT_TYPES.HISTORY_POLICY.ID"
                            [policyRecord]="content"
                            (completePolicy)="onCompletePolicy($event)"
                            (showEndorsement)="onShowEndorsementFromRecord($event)"
                            (showCancellationEvidence)="onShowCancellationEvidence($event)"
                            (showPolicy)="onShowPolicyFromRecord($event)"
                            (showPolicyDetails)="onShowPolicyDetailsFromRecord($event)"
                            (showSinister)="onShowSinister($event)"
                            (showSinisterDetails)="onShowSinisterDetails($event)"
                        ></agt-card-policy-record>
                        <agt-card-receipt-paid-record *ngSwitchCase="CONTENT_TYPES.PAYMENT_HISTORY.ID"
                            [receiptPaid]="content"
                            (deleteReceiptPaid)="onDeleteReceiptPaid($event)"
                        ></agt-card-receipt-paid-record>
                        <agt-card-sinister-log *ngSwitchCase="CONTENT_TYPES.SINISTER_HISTORY.ID"
                            [sinisterLog]="content"
                            (updateSinisterEvent)="onUpdateSinisterEvent($event)"
                            (deleteSinisterEvent)="onDeleteSinisterEvent($event)"
                            (showResolutionEvidence)="onShowResolutionEvidence($event)"
                            (showReactivationEvidence)="onShowReactivationEvidence($event)"
                        ></agt-card-sinister-log>
                        <agt-card-reported-sinister *ngSwitchCase="CONTENT_TYPES.POLICY_SINISTERS.ID"
                            [sinister]="content"
                            (showSinister)="onShowSinister($event)"
                            (showSinisterDetails)="onShowSinisterDetails($event)"
                        ></agt-card-reported-sinister>
                    </ng-container>
                </ng-container>
            </ul>
        </div>
    </ng-container>
    <!-- // AGENTHOS - TIMELINE -->
    <!-- AGENTHOS - CONTENT LIST -->
    <ng-template #noHistoryContent>
        <div [class]="cardClasses" *ngFor="let content of contentListService.contents">
            <ng-container [ngSwitch]="contentType">
                <agt-card-contact *ngSwitchCase="CONTENT_TYPES.CONTACT.ID"
                    [contact]="content"
                    (showContactData)="onShowContactData($event)"
                    (contactSelected)="onContactSelected($event)"
                ></agt-card-contact>
                <agt-card-lead *ngSwitchCase="CONTENT_TYPES.LEAD.ID" [lead]="content" (showContactData)="onShowContactData($event)"></agt-card-lead>
                <agt-card-client *ngSwitchCase="CONTENT_TYPES.CLIENT.ID" [client]="content" (showContactData)="onShowContactData($event)"></agt-card-client>
                <agt-card-quotation *ngSwitchCase="CONTENT_TYPES.CONTACT_QUOTATION.ID" [quotation]="content" (showQuotationDetails)="onShowQuotationDetails($event)" (acceptQuotation)="onAcceptQuotation($event)" (rejectQuotation)="onRejectQuotation($event)"></agt-card-quotation>
                <agt-card-policy *ngSwitchCase="CONTENT_TYPES.CONTACT_POLICY.ID"
                    [policy]="content"
                    (showPolicyDetails)="onShowPolicyDetails($event)"
                    (showPolicy)="onShowPolicy($event)"
                    (updatePolicy)="onUpdatePolicy($event)"
                    (endorsePolicy)="onEndorsePolicy($event)"
                    (cancelPolicy)="onCancelPolicy($event)"
                    (renewPolicy)="onRenewPolicy($event)"
                    (reissuePolicy)="onReissuePolicy($event)"
                    (showHistoryPolicy)="onShowHistoryPolicy($event)"
                    (showPaymentHistory)="onShowPaymentHistory($event)"
                    (showPolicySinisters)="onShowPolicySinisters($event)"
                    (deletePolicy)="onDeletePolicy($event)"
                ></agt-card-policy>
                <agt-card-payment *ngSwitchCase="CONTENT_TYPES.PAYMENT.ID"
                    [payment]="content"
                    (applyPayment)="onApplyPayment($event)"
                    (showContactData)="onShowContactData($event)"
                    (showHistoryPolicy)="onShowHistoryPolicy($event)"
                    (cancelPolicy)="onCancelPolicy($event)"
                    (showPaymentHistory)="onShowPaymentHistory($event)"
                    (showPolicy)="onShowPolicyFromWorkspace($event)"
                ></agt-card-payment>
                <agt-card-sinister *ngSwitchCase="(contentType === CONTENT_TYPES.SINISTER.ID || contentType === CONTENT_TYPES.CONTACT_SINISTER.ID) ? contentType : ''"
                    [sinister]="content"
                    (showContactData)="onShowContactData($event)"
                    (showSinisterDetails)="onShowSinisterDetails($event)"
                    (showPolicy)="onShowPolicyFromWorkspace($event)"
                    (showHistorySinister)="onShowHistorySinister($event)"
                    (finalizeSinister)="onFinalizeSinister($event)"
                    (showHistoryPolicy)="onShowHistoryPolicy($event)"
                    (reactivateSinister)="onReactivateSinister($event)"
                ></agt-card-sinister>
                <agt-card-contact-file *ngSwitchCase="CONTENT_TYPES.CONTACT_FILE.ID"
                    [contactFile]="content"
                    (onShowContactFileDetails)="showContactFileDetails($event)"
                    (transferContactFile)="onTransferContactFile($event)"
                    (updateContactFile)="onUpdateContactFile($event)"
                    (deleteContactFile)="onDeleteContactFile($event)"
                ></agt-card-contact-file>
            </ng-container>
        </div>
    </ng-template>
    <!-- //AGENTHOS - CONTENT LIST -->
</div>

<agt-loading-content [isLoadingContent]="isLoadingContent"></agt-loading-content>
<agt-content-results [isLoadingContent]="isLoadingContent" [contentResultData]="contentListService.contentResultData" [contentTypeName]="contentTypeName" [contentSubtypeName]="contentSubtypeName" (loadMoreContents)="onLoadMoreContents()"></agt-content-results>
<agt-content-back *ngIf="!isHistoryContent" [isLoadingContent]="isLoadingContent" [contentResultData]="contentListService.contentResultData" [contentType]="contentType" [query]="query" [contactId]="contactId"></agt-content-back>
<agt-content-suggestions *ngIf="!isHistoryContent" [isLoadingContent]="isLoadingContent" [contentResultData]="contentListService.contentResultData" [contentType]="contentType" [contentTypeName]="contentTypeName"></agt-content-suggestions>

<!-- AGENTHOS - CONTENT ACTIONS -->
<ng-container *ngIf="contentType === CONTENT_TYPES.CONTACT.ID || contentType === CONTENT_TYPES.LEAD.ID || contentType === CONTENT_TYPES.CLIENT.ID || contentType === CONTENT_TYPES.PAYMENT.ID || contentType === CONTENT_TYPES.SINISTER.ID || contentType === CONTENT_TYPES.CONTACT_SINISTER.ID">
    <agt-modal-show-contact-data [modalId]="modalIdShowContactData" [contactId]="selectedContactId"></agt-modal-show-contact-data>
    <agt-modal-select-contact [modalId]="modalIdSelectContact" [contactId]="selectedContactId"></agt-modal-select-contact>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.CONTACT_QUOTATION.ID">
    <agt-modal-show-quotation-details [modalId]="modalIdShowQuotationDetails" [contactId]="contactId" [quotationId]="selectedQuotationId"></agt-modal-show-quotation-details>
    <agt-modal-confirm-accept-quotation [modalId]="modalIdAcceptQuotation" [contactId]="contactId" [quotationId]="selectedQuotationId"></agt-modal-confirm-accept-quotation>
    <agt-modal-confirm-reject-quotation [modalId]="modalIdRejectQuotation" [contactId]="contactId" [quotationId]="selectedQuotationId"></agt-modal-confirm-reject-quotation>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.HISTORY_POLICY.ID">
    <agt-modal-show-endorsement [modalId]="modalIdShowEndorsement" [contactId]="contactId" [policyId]="policyId" [endorsementId]="selectedEndorsementId"></agt-modal-show-endorsement>
    <agt-modal-show-cancellation-evidence [modalId]="modalIdShowCancellationEvidence" [cancelledPolicyId]="selectedCancelledPolicyId"></agt-modal-show-cancellation-evidence>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.CONTACT_POLICY.ID || contentType === CONTENT_TYPES.HISTORY_POLICY.ID || contentType === CONTENT_TYPES.PAYMENT.ID || contentType === CONTENT_TYPES.SINISTER.ID || contentType === CONTENT_TYPES.CONTACT_SINISTER.ID">
    <agt-modal-show-policy-details [modalId]="modalIdShowPolicyDetails" [contactId]="selectedContactId" [policyId]="selectedPolicyId" [isHistoryContent]="isHistoryContent" (showPolicy)="onShowPolicy($event)"></agt-modal-show-policy-details>
    <agt-modal-show-policy [modalId]="modalIdShowPolicy" [contactId]="selectedContactId" [policyId]="selectedPolicyId"></agt-modal-show-policy>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.CONTACT_POLICY.ID">
    <agt-modal-confirm-update-policy [modalId]="modalIdConfirmUpdatePolicy" [contactId]="contactId" [policyId]="selectedPolicyId"></agt-modal-confirm-update-policy>
    <agt-modal-confirm-endorse-policy [modalId]="modalIdConfirmEndorsePolicy" [contactId]="contactId" [policyId]="selectedPolicyId"></agt-modal-confirm-endorse-policy>
    <agt-modal-confirm-renew-policy [modalId]="modalIdConfirmRenewPolicy" [contactId]="contactId" [policyId]="selectedPolicyId" (actionTypeSelected)="onActionTypeSelected($event)"></agt-modal-confirm-renew-policy>
    <agt-modal-confirm-reissue-policy [modalId]="modalIdConfirmReissuePolicy" [contactId]="contactId" [policyId]="selectedPolicyId" (actionTypeSelected)="onActionTypeSelected($event)"></agt-modal-confirm-reissue-policy>
    <agt-modal-select-contact-type [modalId]="modalIdSelectContactType" [actionType]="selectedActionType" [contactId]="contactId" [policyId]="selectedPolicyId"></agt-modal-select-contact-type>
    <agt-modal-confirm-show-policy-sinisters [modalId]="modalIdConfirmShowPolicySinisters" [policyData]="selectedPolicyData"></agt-modal-confirm-show-policy-sinisters>
    <agt-modal-confirm-delete-policy-complete [modalId]="modalIdConfirmDeleteCompletePolicy" [contactId]="contactId" [policyId]="selectedPolicyId" (policyCompleteDeleted)="onPolicyDeleted()"></agt-modal-confirm-delete-policy-complete>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.CONTACT_POLICY.ID || contentType === CONTENT_TYPES.PAYMENT.ID || contentType === CONTENT_TYPES.SINISTER.ID || contentType === CONTENT_TYPES.CONTACT_SINISTER.ID">
    <agt-modal-confirm-cancel-policy [modalId]="modalIdConfirmCancelPolicy" [contactId]="contactId" [policyId]="selectedPolicyId"></agt-modal-confirm-cancel-policy>
    <agt-modal-confirm-show-history-policy [modalId]="modalIdConfirmShowHistoryPolicy" [contactId]="contactId" [policyId]="selectedPolicyId"></agt-modal-confirm-show-history-policy>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.PAYMENT.ID || contentType === CONTENT_TYPES.CONTACT_POLICY.ID">
    <agt-modal-apply-payment [modalId]="modalIdApplyPayment" [contactId]="selectedContactId" [policyId]="selectedPolicyId" [paymentId]="selectedPaymentId" (receiptPaid)="onReceiptPaid()"></agt-modal-apply-payment>
    <agt-modal-confirm-show-payment-history [modalId]="modalIdConfirmShowPaymentHistory" [contactId]="selectedContactId" [policyId]="selectedPolicyId" [paymentId]="selectedPaymentId"></agt-modal-confirm-show-payment-history>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.PAYMENT_HISTORY.ID">
    <agt-modal-confirm-delete-receipt-paid [modalId]="modalIdConfirmDeleteReceiptPaid" (deleteReceiptPaidConfimed)="onDeleteReceiptPaidConfirmed()"></agt-modal-confirm-delete-receipt-paid>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.SINISTER.ID || contentType === CONTENT_TYPES.CONTACT_SINISTER.ID || contentType === CONTENT_TYPES.POLICY_SINISTERS.ID || contentType === CONTENT_TYPES.HISTORY_POLICY.ID">
    <agt-modal-show-sinister-details [modalId]="modalIdShowSinisterDetails" [sinister]="selectedSinister"></agt-modal-show-sinister-details>
    <agt-modal-confirm-show-sinister-history [modalId]="modalIdConfirmShowSinisterHistory" [sinisterData]="selectedSinisterData"></agt-modal-confirm-show-sinister-history>
    <agt-modal-confirm-finalize-sinister [modalId]="modalIdConfirmFinalizeSinister" [sinisterData]="selectedSinisterData"></agt-modal-confirm-finalize-sinister>
    <agt-modal-confirm-reactivate-sinister [modalId]="modalIdConfirmReactivateSinister" [sinisterData]="selectedSinisterData"></agt-modal-confirm-reactivate-sinister>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.SINISTER_HISTORY.ID">
    <agt-modal-update-sinister-event [modalId]="modalIdUpdateSinisterEvent" [sinisterEventData]="selectedSinisterEventData"></agt-modal-update-sinister-event>
    <agt-modal-confirm-delete-sinister-event [modalId]="modalIdConfirmDeleteSinisterEvent" [sinisterEventData]="selectedSinisterEventData"></agt-modal-confirm-delete-sinister-event>
    <agt-modal-show-resolution-evidence [modalId]="modalIdShowResolutionEvidence" [evidenceUrl]="selectedEvidenceUrl"></agt-modal-show-resolution-evidence>
    <agt-modal-show-reactivation-evidence [modalId]="modalIdShowReactivationEvidence" [evidenceUrl]="selectedEvidenceUrl"></agt-modal-show-reactivation-evidence>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.POLICY_SINISTERS.ID || contentType === CONTENT_TYPES.HISTORY_POLICY.ID">
    <agt-modal-confirm-show-sinister [modalId]="modalIdConfirmShowSinister" [sinisterData]="selectedSinisterData"></agt-modal-confirm-show-sinister>
</ng-container>
<ng-container *ngIf="contentType === CONTENT_TYPES.CONTACT_FILE.ID">
    <agt-modal-show-contact-file-details [modalId]="modalIdShowContactFileDetails" [contactFileData]="selectedContactFileData" (transferContactFile)="onTransferContactFile($event)"></agt-modal-show-contact-file-details>
    <agt-modal-transfer-contact-file [modalId]="modalIdTransferContactFile" [contactFileData]="selectedContactFileData"></agt-modal-transfer-contact-file>
    <agt-modal-confirm-update-contact-file [modalId]="modalIdConfirmUpdateContactFile" [contactFileData]="selectedContactFileData"></agt-modal-confirm-update-contact-file>
    <agt-modal-confirm-delete-contact-file [modalId]="modalIdConfirmDeleteContactFile" [contactFileData]="selectedContactFileData"></agt-modal-confirm-delete-contact-file>
</ng-container>
<!-- //AGENTHOS - CONTENT ACTIONS -->
