<div class="card">
    <div class="card-header pt-2 pb-0 border-bottom-0">
        <h3 class="card-title">Prima Emitida ({{year}})</h3>
        <div class="card-options">
            <i class="fe fe-shield mr-1 text-primary fs-30"></i>
        </div>
    </div>
    <div class="card-body pt-0" *ngIf="!!model.annualWallet">
        <h2 class="mb-0 number-font">$<span class="counter">{{model.annualWallet.issuedAnnualWallet | currency: '': '': '0.2-2'}}</span> {{model.annualWallet.currencyName}}</h2>
        <div class="row mt-3 dash1">
            <div class="col  border-right">
                <h6 class="font-weight-500 number-font1 mb-0">{{model.annualWallet.totalIssuedAnnualNewPolicies}}</h6>
                <span class="text-muted">Pólizas<br/>Nuevas</span>
            </div>
            <div class="col  border-right">
                <h6 class="font-weight-500 number-font1 mb-0">{{model.annualWallet.totalIssuedAnnualRenewedPolicies}}</h6>
                <span class="text-muted">Pólizas<br/>Renovadas</span>
            </div>
            <div class="col ">
                <p class="font-weight-500 number-font1 mb-0">A+</p>
                <span class="text-muted">Score<br/>de Socio</span>
            </div>
        </div>
    </div>
    <agt-loading-content
        [isLoadingContent]="!model.loadedContent"
        [height]="130"
    ></agt-loading-content>
    <div class="card-footer text-center">
        <ng-container [ngSwitch]="pageType">
            <ng-container *ngSwitchCase="CONTACT_PROFILE_PAGE_TYPES.QUOTATIONS.ID">
                <button type="button" class="btn btn-block btn-primary" (click)="createQuotation()"><strong>COTIZAR SEGURO</strong></button>
            </ng-container>
            <ng-container *ngSwitchCase="CONTACT_PROFILE_PAGE_TYPES.POLICIES.ID">
                <button type="button" class="btn btn-block btn-primary" (click)="createPolicy()"><strong>CARGAR PÓLIZA</strong></button>
            </ng-container>
            <ng-container *ngSwitchCase="CONTACT_PROFILE_PAGE_TYPES.SINISTERS.ID">
                <button type="button" class="btn btn-block btn-primary" (click)="createSinister()"><strong>REPORTAR SINIESTRO</strong></button>
            </ng-container>
            <ng-container *ngSwitchCase="CONTACT_PROFILE_PAGE_TYPES.CONTACT_INFORMATION.ID">
                <button type="button" class="btn btn-block btn-primary" (click)="showModelToSelectContactSource()"><strong>CAMBIAR ORIGEN</strong></button>
            </ng-container>
            <ng-container *ngSwitchDefault>
                <button type="button" class="btn btn-block btn-primary" disabled><strong>MUY PRONTO</strong></button>
            </ng-container>
        </ng-container>
    </div>
</div>

<agt-modal-confirm-create-sinister
    [modalId]="modalIdConfirmCreateSinister"
    (createSinisterConfirmed)="onCreateSinisterConfirmed()"
></agt-modal-confirm-create-sinister>

<agt-modal-search-contact-policy
    [modalId]="modalIdSearchContactPolicy"
    [message]="searchContactPolicyMessage"
    [contactId]="contactId"
    (policyFound)="onPolicyFound($event)"
></agt-modal-search-contact-policy>

<agt-modal-create-sinister
    [modalId]="modalIdCreateSinister"
    [contactId]="contactId"
    [policyId]="policyId"
    [insuranceId]="insuranceId"
></agt-modal-create-sinister>

<ng-container *ngIf="!!model.contact">
    <agt-modal-select-contact-source
        [modalId]="modalIdSelectContactSource"
        [contactSourceId]="model.contact.contactSourceId"
        [contactSourceTypeId]="model.contact.contactSourceTypeId"
        (contactSourceIdSelected)="updateContactSource($event)"
    ></agt-modal-select-contact-source>
</ng-container>
