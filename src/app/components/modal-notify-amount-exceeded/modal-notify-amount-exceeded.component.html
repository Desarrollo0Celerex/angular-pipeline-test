<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Saldo Sobrante</h5>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify">Al aplicar este pago se superará el monto de la prima total por
                            <strong>${{amountExceeded | currency: '': '': '0.2-2'}} {{currencyName}}</strong>.
                            <strong>Por favor confirma si deseas continuar</strong>.
                        </p>
                        <p class="text-justify">Si lo deseas, puedes ver el historial de pagos para verificar todos los pagos aplicados al momento.</p>
						<button type="button" class="btn btn-block btn-primary mt-5" (click)="goToPaymentHistory()"><strong>VER HISTORIAL DE PAGOS</strong></button>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
				<button type="button" class="btn btn-primary" (click)="confirmAction()">CONFIRMAR</button>
			</div>
		</div>
	</div>
</div>
