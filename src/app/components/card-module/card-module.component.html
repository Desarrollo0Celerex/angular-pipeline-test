<div class="card">
    <div class="card-body text-center">
        <i class="fa {{icon}} agt-icon-primary fa-3x"></i>
        <h6 class="mt-3 mb-3">{{title}}</h6>
        <ol class="breadcrumb1">
            <li class="breadcrumb-item1">Configura tus <strong>{{subtitle}}</strong> {{description}}</li>
        </ol>
    </div>
    <div class="card-footer">
        <a [routerLink]="'/' + route">
            <button type="button" class="btn btn-block agt-btn-warning-light"><i class="fe fe-settings mr-2"></i><strong>CONFIGURAR</strong></button>
        </a>
    </div>
</div>
