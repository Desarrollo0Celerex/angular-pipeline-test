<!-- AGENTHOS - KPIS -->
<div class="row">
    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12" *ngFor="let kpi of contentKpisService.kpis">
        <div class="card">
            <div class="card-header pt-2 pb-0 border-bottom-0">
                <!-- AGENTHOS - ACTIVE TAB -->
                <h6 class="mb-0">{{contentTypeName}}<br/>{{kpi.name | pluralNameFormat}}</h6>
                <div class="card-options" [ngClass]="{'agt-hide': contentSubtype === kpi.contentSubtype}">
                    <a [routerLink]="" [queryParams]="{'contentSubtype': kpi.contentSubtype }">
                        <button class="btn btn-sm btn-secondary"><i class="fe fe-eye mr-2"></i>VER</button>
                    </a>
                </div>
            </div>
            <div class="card-body d-flex">
                <div class="">
                    <h4 class="mb-1"><span class="number-font"><span class="counter">{{kpi.total}}</span></span></h4>
                    <p class="mb-0 text-muted"><span class="text-green fs-13 mr-2">({{kpi.percentage | percent}})</span>Sobre el Total</p>
                </div>
                <div class="ml-auto">
                    <div class="feature">
                        <div class="fa-stack fa-lg fa-2x icon bg-{{kpi.background}} icon-service">
                            <i class="mdi {{kpi.icon}} fa-stack-1x text-white"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
