<div class="card">
    <div class="card-header pt-2 pb-0 border-bottom-0">
        <h3 class="card-title">Prima Global</h3>
        <div class="card-options">
            <i data-toggle="popover" data-placement="left" class="fe fe-help-circle fs-20 text-primary" data-content="Valor de las pólizas activas del Grupo." data-original-title="" title=""></i>
        </div>
    </div>
    <div class="card-body pt-0" *ngIf="model.group">
        <h2 class="mb-0 number-font">{{model.group.totalGlobalCurrentWallet | currency: '': '$': '0.2-2'}} {{model.group.currencyName | uppercase}}</h2>
        <div class="row mt-3 dash1">
            <div class="col  border-right">
                <h6 class="font-weight-500 number-font1 mb-0">{{model.group.totalActivePolicies}}</h6>
                <span class="text-muted">Pólizas<br/>Activas</span>
            </div>
            <div class="col  border-right">
                <h6 class="font-weight-500 number-font1 mb-0">{{model.group.totalExpiredPolicies}}</h6>
                <span class="text-muted">Pólizas<br/>Vencidas</span>
            </div>
            <div class="col ">
                <p class="font-weight-500 number-font1 mb-0">{{model.group.totalCancelledPolicies}}</p>
                <span class="text-muted">Pólizas<br/>Canceladas</span>
            </div>
        </div>
    </div>
    <agt-loading-content
        [isLoadingContent]="model.group === null"
        [height]="130"
    ></agt-loading-content>
    <div class="card-footer text-center">
        <button type="button" class="btn btn-block btn-primary" (click)="goToGroupPolicies()"><strong>VER PÓLIZAS</strong></button>
    </div>
</div>
