<!-- AGENTHOS - DATASUITE REPORTS DOWNLOAD -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Generar Reporte</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">Selecciona el tipo de reporte que deseas generar.</li>
				</ol>
				<div class="row">
					<div class="col-md-12 mt-3">
						<!-- AGENTHOS - DOWNLOAD REPORT PDF -->
						<button type="button" class="btn btn-block btn-default" (click)="selectFormat(FORMAT_TYPES.PDF)"><i class="fa fa-line-chart mr-2"></i><strong>REPORTE EJECUTIVO (PDF)</strong></button>
					</div>
					<div class="col-md-12 mt-3">
						<!-- AGENTHOS - DOWNLOAD REPORT EXCEL -->
						<button type="button" class="btn btn-block btn-default" (click)="selectFormat(FORMAT_TYPES.XLSX)"><i class="fa fa-sort-alpha-asc mr-2"></i><strong>REPORTE EDITABLE (XLSX)</strong></button>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - DATASUITE REPORTS DOWNLOAD -->
