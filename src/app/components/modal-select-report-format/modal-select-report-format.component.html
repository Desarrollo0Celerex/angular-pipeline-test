<!-- AGENTHOS - DATASUITE REPORTS DOWNLOAD -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Descargar Reporte</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify">Selecciona el formato que deseas para tu reporte.</p>
					</div>
					<div class="col-md-12">
						<!-- AGENTHOS - PDF REPORT -->
						<div class="col-md-12 mt-5">
							<button type="button" class="btn btn-primary btn-block" (click)="selectFormat(FORMAT_TYPES.PDF)"><strong>REPORTE EJECUTIVO (PDF)</strong></button>
						</div>
						<!-- AGENTHOS - CSV REPORT -->
						<div class="col-md-12 mt-5">
							<button type="button" class="btn btn-primary btn-block" (click)="selectFormat(FORMAT_TYPES.XLSX)"><strong>REPORTE EDITABLE (XLSX)</strong></button>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - DATASUITE REPORTS DOWNLOAD -->
