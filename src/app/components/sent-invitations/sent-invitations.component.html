<!-- AGENTHOS - SENT INVITES -->
<div class="row" *ngIf="containerListSentInvitationsService.invitationsSent.length > 0">
    <div class="col-md-12 col-lg-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Invitaciones Enviadas</h3>
            </div>
            <!-- AGENTHOS - PENDANT INVITE -->
            <div class="card-body" *ngFor="let invitation of containerListSentInvitationsService.invitationsSent; let invitationIndex = index">
                <div class="row">
                    <div class="col-md-3">
                        <div class="form-group">
                            <!-- AGENTHOS - ATOM ACCOUNT USER NAME -->
                            <label class="form-label">Nombre de Colaborador</label>
                            <input type="text" class="form-control" [placeholder]="invitation.name" disabled="">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <!-- AGENTHOS - ATOM ACCOUNT USER MAIL -->
                            <label class="form-label">Correo Electrónico</label>
                            <input type="text" class="form-control" [placeholder]="invitation.email" disabled="">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <!-- AGENTHOS - USER ROLE -->
                            <label class="form-label">Rol Asignado</label>
                            <button type="button" class="btn btn-radius btn-block btn-default-light disabled" data-container="body" data-toggle="popover" data-popover-color="default" data-placement="top" title="" data-content="El rol podrá ser actualizado hasta que la invitación sea aceptada." data-original-title="Rol Asignado:">
                                <i class="fe fe-sliders mr-2"></i>{{getRoleName(invitation.roleId)}}
                            </button>
                        </div>
                    </div>
                    <div class="col-md-3 text-right">
                        <label class="form-label">Acciones</label>
                        <div class="btn-list">
                            <button type="button" class="btn btn-icon btn-primary" data-toggle="tooltip" data-placement="bottom" data-original-title="Reenviar Invitación" (click)="onClickResendInvitation(invitation.invitationId)"><i class="fe fe-mail"></i></button>
                            <button type="button" class="btn btn-icon btn-secondary" data-toggle="tooltip" data-placement="bottom" data-original-title="Eliminar Invitación" (click)="onClickDeleteInvitation(invitation.invitationId, invitationIndex)"><i class="fe fe-trash-2"></i></button>
                            <button type="button" class="btn btn-icon btn-success" data-toggle="tooltip" data-placement="bottom" data-original-title="Compartir Invitación" (click)="onClickShareInvitation(invitation.invitationToken)"><i class="fe fe-send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- //AGENTHOS - PENDANT INVITE -->
        </div>
    </div>
</div>
<!-- //AGENTHOS - SENT INVITES -->

<agt-modal-share-invitation-link [modalId]="shareInvitationLinkModalId" [invitationLink]="invitationLink"></agt-modal-share-invitation-link>
