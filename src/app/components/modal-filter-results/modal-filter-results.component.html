<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Filtrar Resultados</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<ul class="list-group">
							<li class="list-group-item" *ngFor="let filter of filters; let index = index">
								{{filter.name}}
								<div class="material-switch pull-right">
									<input id="agtResultOption{{index + 1}}" type="checkbox" [checked]="filter.selected" (change)="toggleFilter(index)"/>
									<label for="agtResultOption{{index + 1}}" class="label-success"></label>
								</div>
							</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
				<button type="button" class="btn btn-primary" (click)="confirmAction()">CONFIRMAR</button>
			</div>
		</div>
	</div>
</div>
