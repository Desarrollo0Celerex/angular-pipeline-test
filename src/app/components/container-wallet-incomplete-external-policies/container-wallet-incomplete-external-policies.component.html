<!-- AGENTHOS - INCOMPLETE POLICIES -->
<!-- (JUST IF INCOMPLETE POLICIES DETECTED) -->
<div class="row mt-3" *ngIf="model.externalPolicies.length > 0">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Pólizas Externas</h3>
            </div>
        </div>
    </div>
    <!-- AGENTHOS - POLICY CARD -->
    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12" *ngFor="let externalPolicy of model.externalPolicies">
        <agt-card-external-policy
            [externalPolicy]="externalPolicy"
            (showExternalPolicy)="showExternalPolicy($event)"
            (confirmValidateExternalPolicy)="confirmValidateExternalPolicy($event)"
            (confirmUpdateExternalPolicy)="confirmUpdateExternalPolicy($event)"
        ></agt-card-external-policy>
    </div>
    <!-- AGENTHOS - POLICY CARD -->

    <!-- AGENTHOS - SHOW MORE -->
    <div class="col-12" *ngIf="model.totalExternalPolicies > 4">
        <div class="card">
            <div class="card-body">
                <!-- AGENTHOS - LOAD MORE (ONLY IF PENDING ITEMS) -->
                <div class="btn-list text-center">
                    <button type="button" class="btn btn-block btn-primary" (click)="goToListExternalPolicies()"><strong>MOSTRAR TODAS</strong></button>
                </div>
            </div>
        </div>
    </div>
    <!-- //AGENTHOS - SHOW MORE -->
</div>
<!-- AGENTHOS - INCOMPLETE POLICIES -->

<agt-modal-confirm-validate-external-policy [modalId]="modalIdConfirmValidateExternalPolicy" (actionConfirmed)="goToUpdateExternalPolicy()"></agt-modal-confirm-validate-external-policy>
<agt-modal-confirm-update-external-policy [modalId]="modalIdConfirmUpdateExternalPolicy" (actionConfirmed)="goToUpdateExternalPolicy()"></agt-modal-confirm-update-external-policy>
<agt-modal-show-policy-file [modalId]="modalIdShowPolicyFile" [policyUrl]="selectedExternalPolicyUrl"></agt-modal-show-policy-file>
