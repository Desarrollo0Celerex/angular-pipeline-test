<div class="card" *ngIf="!!quotation">
    <!-- AGENTHOS - QUOTE HEADER -->
    <div class="card-header pt-2 pb-0 border-bottom-0">
        <!-- AGENTHOS - INSURANCE CLASS -->
        <h6 class="mb-0">{{quotation.insuranceName | uppercase}}</h6>
        <!-- AGENTHOS - QUOTE MENU -->
        <div class="card-options">
            <a href="" class="mr-2 text-default" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">
                <span class="fa fa-bars"></span>
            </a>
            <!-- AGENTHOS - ESTATUS MENU -->
            <div class="dropdown-menu dropdown-menu-right" role="menu">
                <a class="dropdown-plus-title">Estatus</a>
                <button type="button" name="agtQuoteAccepted" class="dropdown-item" data-toggle="modal" data-target="#agtQuotePolicy">Aceptada</button>
                <button type="button" name="agtQuoteDenied" class="dropdown-item" data-toggle="modal" data-target="#agtQuoteReject">Rechazada</button>
            </div>
            <!-- //AGENTHOS - ESTATUS MENU -->
        </div>
        <!-- //AGENTHOS - QUOTE MENU -->
    </div>
    <!-- //AGENTHOS - QUOTE HEADER -->
    <!-- AGENTHOS - QUOTE BODY -->
    <div class="card-body">
        <div class="d-flex clearfix">
            <div class="text-left">
                <!-- AGENTHOS - QUOTE STATUS -->
                <div class="badge badge-{{quotation.quotationStatusBackground}} mr-1 mb-3">{{quotation.quotationStatusName | uppercase}}</div>
                <!-- AGENTHOS - INSURANCE TYPE -->
                <h6><span class="text-primary"><i class="fe fe-globe mr-2 fs-20"></i></span>{{quotation.insuranceTypeName | uppercase}}</h6>
                <!-- AGENTHOS - QUOTE DATE -->
                <h6><span class="text-primary"><i class="fe fe-calendar mr-2 fs-20"></i></span>{{quotation.createdAt | date: 'dd/MM/yyyy'}}</h6>
            </div>
            <div class="ml-auto">
                <span class="healthInsurance icon-service"><i class="fa fa-medkit fs-2"></i></span>
            </div>
        </div>
        <!-- AGENTHOS - QUOTE DESCRIPTION -->
        <h6 class="mt-3">{{quotation.description}}</h6>
    </div>
    <!-- //AGENTHOS - QUOTE BODY -->
    <!-- AGENTHOS - QUOTE FOOTER -->
    <div class="card-footer">
        <div class="row">
            <!-- AGENTHOS - QUOTE DETAILS -->
            <div class="col-sm-9 col-9 text-left">
                <button type="button" class="btn btn-block btn-primary" (click)="onClickShowDetails()"><strong>VER DETALLES</strong></button>
            </div>
            <!-- AGENTHOS - QUOTE ACCEPTED -->
            <div class="col-sm-3 col-3 text-right">
                <button type="button" class="btn btn-icon btn-secondary"><i class="fa fa-check-square-o"></i></button>
            </div>
        </div>
    </div>
    <!-- //AGENTHOS - QUOTE FOOTER -->
</div>
