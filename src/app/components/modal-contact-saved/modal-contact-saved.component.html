<!-- AGENTHOS - CONTACT DONWLOAD VCARD -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Contacto Guardado</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-8">
                        <p class="text-justify"><strong>El contacto ha sido guardado con éxito en Agenthos.</strong> Ahora puedes interactuar con este contacto para cotizar y emitir pólizas.</p>

                        <p class="text-jutify"><strong>¿Quieres transferir el contacto?</strong></p>
                        <p class="text-justify">
                        Apunta con la cámara de tu Smartphone al código inteligente y los datos de contacto serán transferidos automáticamente.</p>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group text-center">
                            <agt-qrcode-transfer-contact [contactId]="contactId"></agt-qrcode-transfer-contact>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="col-12">
                    <a href="../profile/vcard.vcf" target="_blank">
                    <button type="button" name="agtContactDownload" class="btn btn-block btn-primary"><strong>DESCARGAR CONTACTO</strong></button></a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - CONTACT DOWNLOAD VCARD -->
