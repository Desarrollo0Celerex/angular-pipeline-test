<!-- AGENTHOS - CONTACT TYPE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Tipo de Contacto</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <!-- AGENTHOS - PERSONAL CLIENT -->
                        <div class="col-md-12 mt-5">
                            <button type="button" class="btn btn-primary btn-block" (click)="onClickCreateContact(CONTACT_TYPES.PERSON)"><i class="fe fe-user mr-2"></i><strong>PERSONA</strong></button>
                        </div>
                        <!-- AGENTHOS - COMPANY CLIENT -->
                        <div class="col-md-12 mt-5">
                            <button type="button" class="btn btn-primary btn-block" (click)="onClickCreateContact(CONTACT_TYPES.COMPANY)"><i class="fe fe-briefcase mr-2"></i><strong>EMPRESA</strong></button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - CONTACT TYPE -->
