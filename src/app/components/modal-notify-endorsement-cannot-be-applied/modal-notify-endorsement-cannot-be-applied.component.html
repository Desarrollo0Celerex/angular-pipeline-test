<!-- AGENTHOS - ENDORSEMENT APPLY -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <!-- AGENTHOS - DETAILS CARD -->
                <h5 class="modal-title">Endoso invalido</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p class="text-justify">
                            El endoso no puede ser aplicado debido a que ya no hay recibos pendientes o el monto a decrementar supera el monto pendiente de la póliza.
                        </p>
                    </div>
                </div>
            </div>
            <div class="modal-footer text-center">
                <div class="col-12">
                    <button type="button" class="btn btn-primary btn-block" data-dismiss="modal"><strong>ENTENDIDO</strong></button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - ENDORSEMENT UPDATE -->
