<div class="card">
	<div class="card-header pt-2 pb-0 border-bottom-0">
		<h3 class="card-title">Recibos</h3>
		<div class="card-options">
			<i data-toggle="popover" data-placement="left" class="fe fe-help-circle fs-20 text-primary" data-content="Recibos totales de la póliza." data-original-title="" title=""></i>
		</div>
	</div>
	<!-- AGENTHOS - POLICY RECEIPTS -->
    <div id="agt-record-policy-payments"></div>
    <agt-loading-content [isLoadingContent]="!canShowChart" [height]="200"></agt-loading-content>
	<div class="card-footer" *ngIf="!!canShowFooter">
        <div class="row">
            <div class="col-12 text-left">
                <button type="button" class="btn btn-block btn-primary" (click)="confirmAction()"><strong>VER PAGOS</strong></button>
            </div>
        </div>
    </div>
</div>
