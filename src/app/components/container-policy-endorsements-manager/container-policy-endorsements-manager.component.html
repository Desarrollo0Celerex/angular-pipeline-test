<!-- AGENTHOS - ENDORSEMENTS CONTROL -->
<div class="row mt-3">
    <div class="col-lg-12">
        <div class="card">
            <!-- AGENTHOS - ENDORSEMENTS CONTROL HEADER -->
            <div class="card-header">
                <h3 class="card-title">Gestión de Endosos</h3>
            </div>
            <!-- AGENTHOS - ENDORSEMENTS CONTROL HEADER -->
            <!-- AGENTHOS - ENDORSEMENTS CONTROL BODY -->
            <div class="card-body">
                <div class="btn-list mt-3">
                    <button type="button" class="btn btn-secondary" (click)="showModalToShowPolicyFile()"><strong>VER PÓLIZA</strong></button>
                    <button type="button" class="btn btn-primary" (click)="showModalToConfirmShowPolicyHistory()"><strong>VER HISTORIAL</strong></button>
                    <button type="button" class="btn btn-primary" (click)="showModalToConfirmEndorsePolicy()"><strong>APLICAR ENDOSO</strong></button>
                </div>
            </div>
            <!-- //AGENTHOS - ENDORSEMENTS CONTROL BODY -->
        </div>
    </div>
</div>
<!-- //AGENTHOS - ENDORSEMENTS CONTROL -->

<agt-modal-show-policy-file
    [modalId]="modalIdShowPolicyFile"
    [contactId]="contactId"
    [policyId]="policyId"
></agt-modal-show-policy-file>
<agt-modal-confirm-show-history-policy
    [modalId]="modalIdConfirmShowHistoryPolicy"
    [contactId]="contactId"
    [policyId]="policyId"
></agt-modal-confirm-show-history-policy>
<agt-modal-confirm-endorse-policy
    [modalId]="modalIdConfirmEndorsePolicy"
    [contactId]="contactId"
    [policyId]="policyId"
></agt-modal-confirm-endorse-policy>
