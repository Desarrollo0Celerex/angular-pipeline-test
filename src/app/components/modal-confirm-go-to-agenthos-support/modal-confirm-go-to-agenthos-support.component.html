<!-- AGENTHOS - SUPPORT -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Agenthos Support</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">Selecciona el tipo de soporte que deseas.</li>
				</ol>
				<div class="row">
					<div class="col-md-12 mt-3">
						<!-- AGENTHOS - SUPPORT TRAINING -->
						<a href="https://wa.me/525587645020?text=Hola soy {{model.username}} de {{model.workspaceName}}, deseo solicitar una capacitación para resolver dudas sobre Agenthos." target="_blank">
							<button type="button" class="btn btn-block agt-btn-default" (click)="closeModal()"><i class="fa fa-calendar-check-o mr-2"></i><strong>SOLICITAR CAPACITACIÓN</strong></button>
						</a>
					</div>
					<div class="col-md-6 mt-3">
						<!-- AGENTHOS - SUPPORT BUG -->
						<a href="https://wa.me/525587645020?text=Hola soy {{model.username}} de {{model.workspaceName}}, deseo reportar un error en Agenthos. El error es:" target="_blank">
						<button type="button" class="btn btn-block agt-btn-default" (click)="closeModal()"><i class="fa fa-bug mr-2"></i><strong>REPORTAR ERROR</strong></button></a>
					</div>
					<div class="col-md-6 mt-3">
						<!-- AGENTHOS - SUPPORT IDEA -->
						<a href="https://wa.me/525587645020?text=Hola soy {{model.username}} de {{model.workspaceName}}, deseo solicitar un cambio para mejorar Agenthos. La mejora es:" target="_blank">
						<button type="button" class="btn btn-block agt-btn-default" (click)="closeModal()"><i class="fa fa-magic mr-2"></i><strong>SOLICITUD DE MEJORA</strong></button></a>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-block agt-btn-secondary-outline" data-dismiss="modal">CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - SUPPORT -->
