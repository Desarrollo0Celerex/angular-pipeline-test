<!-- AGENTHOS - SINISTER UPDATE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document" *ngIf="!!model.sinister">
		<div class="modal-content">
            <form [formGroup]="model.sinisterDetailsForm" (submit)="onSubmitUpdateSinister()" >
    			<div class="modal-header">
    				<h5 class="modal-title">Actualizar Siniestro</h5>
    				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
    					<span aria-hidden="true">&times;</span>
    				</button>
    			</div>
    			<div class="modal-body">
    				<div class="row">
    					<div class="col-md-12">
    						<div class="form-group">
    							<label class="form-label">Tipo de Siniestro</label>
                                <select class="form-control {{getValidationClass('sinisterTypeId')}}" formControlName="sinisterTypeId">
                                    <option [value]="sinisterType.sinisterTypeId" *ngFor="let sinisterType of model.sinisterTypes">{{sinisterType.name | uppercase}}</option>
                                </select>
                                <div class="invalid-feedback">{{getErrorMessage('sinisterTypeId')}}</div>
    						</div>
    					</div>
    					<div class="col-md-12">
    						<div class="form-group">
    							<label class="form-label">Cobertura Afectada</label>
    							<input type="text" class="form-control {{getValidationClass('affectedCoverage')}}" formControlName="affectedCoverage">
                                <div class="invalid-feedback">{{getErrorMessage('affectedCoverage')}}</div>
    						</div>
    					</div>
    					<div class="col-md-12">
    						<div class="form-group">
    							<label class="form-label">Ubicación Siniestro</label>
    							<input type="text" class="form-control {{getValidationClass('location')}}" formControlName="location">
                                <div class="invalid-feedback">{{getErrorMessage('location')}}</div>
    						</div>
    					</div>
    					<div class="col-md-12">
    						<div class="form-group">
    							<label class="form-label">Nombre Conductor</label>
    							<input type="text" class="form-control {{getValidationClass('affectedName')}}" formControlName="affectedName">
                                <div class="invalid-feedback">{{getErrorMessage('affectedName')}}</div>
    						</div>
    					</div>
    				</div>
    			</div>
    			<div class="modal-footer text-center">
    				<div class="col-12">
    					<!-- AGENTHOS - SINISTER SAVE CHANGES -->
    					<button type="submit" class="btn btn-block btn-primary"><strong>ACTUALIZAR SINIESTRO</strong></button>
    				</div>
    			</div>
            </form>
		</div>
	</div>
</div>
<!-- //AGENTHOS - SINISTER UPDATE -->
