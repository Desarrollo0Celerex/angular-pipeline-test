<!-- AGENTHOS - SINISTER NEW -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <form [formGroup]="modalCreateSinisterService.sinisterForm" (submit)="onSubmitCreateSinister()">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reportar Siniestro</h5>
                    <button type="button" class="close" (click)="onClickCloseModal()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - SINISTER NUMBER * -->
                                <label class="form-label">Número de Siniestro</label>
                                <input type="text" class="form-control {{getValidationClass('sinisterNumber')}}" placeholder="Ingresa el número de siniestro" formControlName="sinisterNumber">
                                <div class="invalid-feedback">{{getErrorMessage('sinisterNumber')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - SINISTER INVOICE * -->
                                <label class="form-label">Número de Folio</label>
                                <input type="text" class="form-control {{getValidationClass('invoice')}}" placeholder="Ingresa el folio del siniestro." formControlName="invoice">
                                <div class="invalid-feedback">{{getErrorMessage('invoice')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - SINISTER CERTIFICATE * -->
                                <label class="form-label">Número de Certificado</label>
                                <input type="text" class="form-control {{getValidationClass('certificate')}}" placeholder="Ingresa el número de certificado." formControlName="certificate">
                                <div class="invalid-feedback">{{getErrorMessage('certificate')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - SINISTER CLASS * -->
                                <label class="form-label">Tipo de Siniestro</label>
                                <select class="form-control custom-select {{getValidationClass('sinisterTypeId')}}" formControlName="sinisterTypeId">
                                    <option [value]="sinisterType.sinisterTypeId" *ngFor="let sinisterType of modalCreateSinisterService.sinisterTypes">{{sinisterType.name}}</option>
                                </select>
                                <div class="invalid-feedback">{{getErrorMessage('sinisterTypeId')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - SINISTER DATE * -->
                                <label class="form-label">Fecha de Siniestro</label>
                                <input [id]="calendarIdSinisterDate" type="text" class="form-control fc-datepicker {{getValidationClass('sinisterDate')}}" placeholder="08/09/2020" formControlName="sinisterDate">
                                <div class="invalid-feedback">{{getErrorMessage('sinisterDate')}}</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-block btn-primary"><strong>REPORTAR SINIESTRO</strong></button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- //AGENTHOS - SINISTER NEW -->
