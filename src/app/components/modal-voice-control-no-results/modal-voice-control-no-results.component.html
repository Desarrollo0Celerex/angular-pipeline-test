<!-- AGENTHOS - VOINCE CONTROL NO RESULTS -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<!-- AGENTHOS - DETAILS CARD -->
				<h5 class="modal-title">Sin Resultados</h5>
                <button type="button" class="close" (click)="onClickCloseModal()">
                    <span aria-hidden="true">&times;</span>
                </button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify"><strong>Lo lamento mucho,</strong></p>
						<p class="text-justify">No logré encontrar resultados con <strong>"{{commandText}}"</strong>. <strong>Por favor intenta nuevamente utilizando otra información relacionada a lo que necesitas.</strong></p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-block btn-primary" (click)="onClickRetry()"><strong>CONTINUAR</strong></button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - VOINCE CONTROL NO RESULTS -->
