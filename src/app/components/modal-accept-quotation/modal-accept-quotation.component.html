<!-- AGENTHOS - ACCEPT QUOTE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Aceptar Cotización</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p class="text-justify"><strong>Para aceptar esta cotización es necesaria la póliza digital.</strong> Por favor continúa solo si ya cuentas con la póliza digital.</p>
                    </div>
                    <div class="col-md-12 mt-3">
                        <p class="text-justify">Si lo deseas, puedes regresar en cualquier momento para aceptar la cotización y cargar la nueva póliza de este contacto.</p>
                    </div>
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary btn-block mt-5" (click)="onClickAcceptQuotation()"><strong>CARGAR PÓLIZA</strong></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="col-md-12">
                    <button type="button" class="btn btn-secondary btn-block" data-dismiss="modal"><strong>CANCELAR</strong></button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- AGENTHOS - ACCEPT QUOTE -->
