<div class="card">
    <div class="card-header pt-2 pb-0 border-bottom-0">
        <h3 class="card-title">{{title}}</h3>
        <div class="card-options">
            <a href="" class="mr-2 text-default" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">
                <span class="fa fa-bars"></span>
            </a>
            <div class="dropdown-menu dropdown-menu-right" role="menu">
                <div class="dropdown-plus-title">Reportes Disponibles</div>
                <button type="button" class="dropdown-item" [ngClass]="{'active': model.selectedReportType === model.REPORT_TYPES.APPLIED_PAYMENTS}" (click)="selectReportType(model.REPORT_TYPES.APPLIED_PAYMENTS)"><i class="fa fa-refresh mr-2"></i>Recibos Aplicados</button>
                <button type="button" class="dropdown-item" [ngClass]="{'active': model.selectedReportType === model.REPORT_TYPES.PENDING_PAYMENTS}" (click)="selectReportType(model.REPORT_TYPES.PENDING_PAYMENTS)"><i class="fa fa-refresh mr-2"></i>Recibos Pendientes</button>
            </div>
        </div>
    </div>
    <div class="card-body text-center">
        <ng-container *ngIf="model.loadedContent; else loadingContent">
            <ol class="breadcrumb1">
                <li class="breadcrumb-item1">Se han detectado <strong>{{description}}</strong> de {{totalGroupPayments}} {{contentTypeName}} por Pagar.
                </li>
            </ol>
            <button type="button" class="btn btn-block btn-primary" (click)="showModalToSelectReportFormat()" [disabled]="!canDownloadReport"><strong>DESCARGAR REPORTE</strong></button>
        </ng-container>
        <ng-template #loadingContent>
            <agt-loading-content
    			[isLoadingContent]="true"
    			[height]="118"
    		></agt-loading-content>
        </ng-template>
    </div>
</div>


<agt-modal-select-report-format
    [modalId]="modalIdSelectReportFormat"
    (formatSelected)="downloadReport($event)"
></agt-modal-select-report-format>
