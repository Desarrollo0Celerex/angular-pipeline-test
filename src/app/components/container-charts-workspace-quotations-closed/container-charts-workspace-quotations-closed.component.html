<div class="row mt-3">
    <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12">
        <agt-chart-insurances
            [data]="model.chartsData.insurances"
            (showModal)="showModalInsurancesToApplyFilter()"
        ></agt-chart-insurances>
    </div>
    <!-- <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12">
        <agt-chart-insurers
            [data]="model.chartsData.insurers"
            (showModal)="showModalInsurersToApplyFilter()"
        ></agt-chart-insurers>
    </div> -->
    <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12">
        <agt-chart-contact-types
            [data]="model.chartsData.contactTypes"
            (showModal)="showModalContactTypesToApplyFilter()"
        ></agt-chart-contact-types>
    </div>
</div>
<!-- //AGENTHOS - SMART INSIGHTS -->

<agt-modal-filter-results
    *ngIf="!!model.filtersData"
    [modalId]="modalIdInsuranceFilterResults"
    [filters]="model.filtersData.insurances.filters"
    (filtersSelected)="applyInsuranceFilters($event)"
></agt-modal-filter-results>

<agt-modal-filter-results
    *ngIf="!!model.filtersData"
    [modalId]="modalIdInsurerFilterResults"
    [filters]="model.filtersData.insurers.filters"
    (filtersSelected)="applyInsurerFilters($event)"
></agt-modal-filter-results>

<agt-modal-filter-results
    *ngIf="!!model.filtersData"
    [modalId]="modalIdContactTypeFilterResults"
    [filters]="model.filtersData.contactTypes.filters"
    (filtersSelected)="applyContactTypeFilters($event)"
></agt-modal-filter-results>
