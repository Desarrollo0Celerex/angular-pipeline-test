<!-- AGENTHOS - SINISTER CERTIFICATE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
            <form [formGroup]="model.form" (submit)="updatePolicySinisterCertificate()" >
    			<div class="modal-header">
    				<h5 class="modal-title">Actualizar Certificado</h5>
    				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
    					<span aria-hidden="true">&times;</span>
    				</button>
    			</div>
    			<div class="modal-body">
    				<div class="row">
    					<div class="col-md-12">
    						<div class="row">
    							<div class="col-md-12">
    								<div class="form-group">
    									<!-- AGENTHOS - POLICY NUMBER -->
    									<label class="form-label">No. Póliza</label>
    									<input type="text" class="form-control" [placeholder]="policyNumber" readonly="">
    								</div>
    							</div>
    							<div class="col-md-12">
    								<div class="form-group">
    									<!-- AGENTHOS - SINISTER TYPE -->
    									<label class="form-label">No. Certificado</label>
    									<input type="text" class="form-control {{getValidationClass('certificate')}}" formControlName="certificate">
                                        <div class="invalid-feedback">{{getErrorMessage('certificate')}}</div>
    								</div>
    							</div>
    						</div>
    					</div>
    				</div>
    			</div>
    			<div class="modal-footer text-center">
    				<div class="col-12">
    					<!-- AGENTHOS - SINISTER SAVE CHANGES -->
    					<button type="submit" class="btn btn-block btn-primary"><strong>ACTUALIZAR SINIESTRO</strong></button>
    				</div>
    			</div>
            </form>
		</div>
	</div>
</div>
<!-- //AGENTHOS - SINISTER CERTIFICATE -->
