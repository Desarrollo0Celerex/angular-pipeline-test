<!-- AGENTHOS - ENDORSEMENT POLICY TICKETS -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
        <form [formGroup]="modalDoCollectionAdjustmentService.form" (submit)="onSubmitApplyEndorsementWithFractionalReceipt()">
    		<div class="modal-content">
    			<div class="modal-header">
    				<!-- AGENTHOS - POLICY NUMBER -->
    				<h5 class="modal-title">Ajuste de Cobranza</h5>
    				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
    					<span aria-hidden="true">&times;</span>
    				</button>
    			</div>
    			<div class="modal-body">
    				<div class="row">
    					<div class="col-md-12">
    						<div class="form-group">
    							<!-- AGENTHOS - ENDORSEMENT PARTIAL TICKET * -->
    							<label class="form-label">Recibo Fraccionado</label>
    							<div class="row gutters-sm">
    								<div class="col">
    									<div class="input-group">
    										<div class="input-group-prepend">
    											<div class="input-group-text">
    												<i class="fe fe-dollar-sign tx-16 lh-0 op-6"></i>
    											</div>
    										</div>
    										<input type="text" class="form-control {{getValidationClass('fractionalReceiptAmount')}}" placeholder="Ingresa el monto del primer recibo fraccionado." formControlName="fractionalReceiptAmount">
                                            <div class="invalid-feedback">{{getErrorMessage('fractionalReceiptAmount')}}</div>
    									</div>
    								</div>
    								<span class="col-auto align-self-center">
    									<span class="form-help" data-toggle="popover" data-placement="top" data-content="Monto del primer recibo independiente." data-original-title="">?</span>
    								</span>
    							</div>
    						</div>
    					</div>
    					<div class="col-md-12">
                            <button type="submit" class="btn btn-block btn-primary mt-5"><strong>APLICAR ENDOSO</strong></button>
    					</div>
    				</div>
    			</div>
    			<div class="modal-footer">
                    <button type="button" class="btn btn-block btn-secondary" (click)="onClickApplyEndorsementWithoutFractionalReceipt()"><strong>SIN RECIBO FRACCIONADO</strong></button>
    			</div>
    		</div>
        </form>
	</div>
</div>
<!-- //AGENTHOS - ENDORSEMENT POLICY TICKETS -->
