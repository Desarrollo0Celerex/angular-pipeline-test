<!-- AGENTHOS - SMART SUGGESTION -->
<div class="col-sm-12 col-md-12" *ngIf="!isLoadingContent && contentResultData.loadedItems === contentResultData.totalItems">
    <div class="alert alert-avatar alert-primary alert-dismissible mt-5 mb-5">
        <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
        <ng-container [ngSwitch]="contentType">
            <ng-container *ngSwitchCase="CONTENT_TYPES.LEAD.ID">
                <ng-container *ngTemplateOutlet="leadSuggestion"></ng-container>
            </ng-container>
        </ng-container>
    </div>
</div>
<!-- AGENTHOS - SMART SUGGESTION -->

<ng-template #leadSuggestion>
    <strong>¿No encuentras al {{contentTypeName | lowercase}}?</strong> <hr class="message-inner-separator">
    <agt-image-agenthos-assistant></agt-image-agenthos-assistant>
    <p>Intenta localizarlo con el <strong>Buscador Inteligente</strong>.</p>
</ng-template>
