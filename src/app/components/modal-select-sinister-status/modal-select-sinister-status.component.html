<!-- AGENTHOS - PROFILE SINISTER HISTORY -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Explorar Historial</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<!-- LIVE SINISTERS -->
					<div class="col-md-12 mt-5" *ngFor="let sinisterStatus of modalSelectSinisterStatusService.sinisterStatus">
						<a [routerLink]="[]" [queryParams]="{'contentSubtype': sinisterStatus.sinisterStatusId }">
							<button type="button" class="btn btn-block {{(contentSubtype === sinisterStatus.sinisterStatusId) ? 'btn-secondary' : 'btn-primary'}}" (click)="onClickSelectSinisterStatus(sinisterStatus.name)"><strong>{{contentTypeName | pluralNameFormat | uppercase }} {{sinisterStatus.name | pluralNameFormat | uppercase}}</strong></button>
						</a>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" name="agtCancelAction" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - PROFILE SINISTER HISTORY -->
