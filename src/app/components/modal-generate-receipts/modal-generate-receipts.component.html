<!-- AGENTHOS - ENDORSEMENT GENERATE TICKET -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <form [formGroup]="modalGenerateReceiptsService.receiptsForm" (submit)="onSubmitGenerateReceipts()">
            <div class="modal-content">
                <div class="modal-header">
                    <!-- AGENTHOS - POLICY NUMBER -->
                    <h5 class="modal-title">Recibos de Endoso</h5>
                    <button type="button" class="close" (click)="onClickCloseModal()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - TOTAL PAYMENT * -->
                                <label class="form-label">Monto Total</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i class="fe fe-dollar-sign tx-16 lh-0 op-6"></i>
                                        </div>
                                    </div>
                                    <input type="text" name="agtPayAmount" class="form-control" placeholder="{{amount | currency: '': '': '0.2-2'}}" disabled="">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - PAY CURRENCY * -->
                                <label class="form-label">Moneda</label>
                                <input type="text" name="agtPayCurrency" class="form-control" [placeholder]="currencyName" disabled="">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - PAYMENT METHOD * -->
                                <label class="form-label">Forma de Pago</label>
                                <select [id]="selectIdPaymentMethod" class="form-control select2 custom-select {{getValidationClass('paymentMethodId')}}" formControlName="paymentMethodId">
                                    <option [value]="paymentMethod.paymentMethodId" *ngFor="let paymentMethod of modalGenerateReceiptsService.paymentMethods">{{paymentMethod.name | uppercase}}</option>
                                </select>
                                <div class="invalid-feedback">{{getErrorMessage('paymentMethodId')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - PAY PLAN * -->
                                <label class="form-label">Tipo de Plan</label>
                                <select [id]="selectIdPaymentPlan" class="form-control select2 custom-select {{getValidationClass('paymentPlanId')}}" formControlName="paymentPlanId">
                                    <option [value]="paymentPlan.paymentPlanId" *ngFor="let paymentPlan of modalGenerateReceiptsService.paymentPlans">{{paymentPlan.name | uppercase}}</option>
                                </select>
                                <div class="invalid-feedback">{{getErrorMessage('paymentPlanId')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - PAY BILLS * -->
                                <label class="form-label">Recibos Totales</label>
                                <input type="text" class="form-control {{getValidationClass('bills')}}" formControlName="bills">
                                <div class="invalid-feedback">{{getErrorMessage('bills')}}</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <!-- AGENTHOS - NEXT PAY * -->
                                <label class="form-label">Primer Pago</label>
                                <div class="row gutters-sm">
                                    <div class="col">
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <div class="input-group-text">
                                                    <i class="fa fa-calendar tx-16 lh-0 op-6"></i>
                                                </div>
                                            </div>
                                            <input [id]="calendarIdPaymentDate" class="form-control fc-datepicker {{getValidationClass('paymentDate')}}" formControlName="paymentDate" type="text">
                                            <div class="invalid-feedback">{{getErrorMessage('paymentDate')}}</div>
                                        </div>
                                    </div>
                                    <span class="col-auto align-self-center">
                                        <span class="form-help" data-toggle="popover" data-placement="top" data-content="Fecha de pago programada para el primer recibo." data-original-title="">?</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <!-- ANGENTHOS - DATA TARGET (AGTVIEW0018) -->
                    <button type="submit" class="btn btn-block btn-primary"><strong>GENERAR RECIBOS</strong></button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- //AGENTHOS - ENDORSEMENT GENERATE TICKET -->
