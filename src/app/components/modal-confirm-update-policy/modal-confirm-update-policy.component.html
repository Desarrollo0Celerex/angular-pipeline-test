<!-- AGENTHOS - POLICY UPDATE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Actualizar Póliza</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p class="text-justify">Actualiza la póliza únicamente si has detectado un error de escritura. <strong>Por favor confirma si deseas continuar</strong>.</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
                <a routerLink="/{{ROUTES_NAME.updateCompletePolicy(contactId, policyId)}}">
                    <button type="button" class="btn btn-primary" (click)="onClickCloseModal()">CONFIRMAR</button>
                </a>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - POLICY UPDATE -->
