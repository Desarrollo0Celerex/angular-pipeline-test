<!-- AGENTHOS - REJECT QUOTE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Rechazar Cotización</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p class="text-justify"><strong>Rechaza esta cotización si se decidió no emitir la póliza.</strong> Por favor confirma que deseas rechazar y mover esta cotización al historial del contacto.</p>
                    </div>
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary btn-block mt-5" (click)="onClickRejectQuotation()"><strong>MOVER AL HISTORIAL</strong></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="col-md-12">
                    <button type="button" class="btn btn-secondary btn-block" data-dismiss="modal"><strong>CANCELAR</strong></button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- AGENTHOS - REJECT QUOTE -->
