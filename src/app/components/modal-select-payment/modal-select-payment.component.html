<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
    	<div class="modal-content">
    		<div class="modal-header">
    			<h5 class="modal-title">Recibos Encontrados</h5>
    			<button type="button" class="close" data-dismiss="modal" aria-label="Close">
    				<span aria-hidden="true">&times;</span>
    			</button>
    		</div>
    		<div class="modal-body">
    			<div class="row">
    				<div class="col-md-12">
    					<p class="text-justify"><strong>Se han detectado diferentes recibos para esta póliza.</strong> Por favor selecciona el recibo al que deseas aplicar el pago.</p>
    				</div>
    				<div class="col-md-12 mt-3">
    					<div class="list-group list-lg-group list-group-flush">
    						<div class="list-group-item list-group-item-action" *ngFor="let payment of payments">
    							<agt-card-payment-short [payment]="payment" (paymentSelected)="selectPayment($event)"></agt-card-payment-short>
    						</div>
    					</div>
    				</div>
    			</div>
    		</div>
    		<div class="modal-footer">
    			<button type="button" class="btn btn-block btn-secondary" data-dismiss="modal"><strong>CANCELAR</strong></button>
    		</div>
    	</div>
    </div>
    </div>
