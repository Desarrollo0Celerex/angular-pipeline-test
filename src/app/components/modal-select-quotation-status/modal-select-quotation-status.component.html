<!-- AGENTHOS - EXPLORE HISTORY -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Seleccionar Acción</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <!-- ACCEPTED QUOTES -->
                    <div class="col-md-12 mt-5" *ngFor="let quotationStatus of modalSelectQuotationTypeService.quotationStatus">
                        <a [routerLink]="[]" [queryParams]="{'contentSubtype': quotationStatus.quotationStatusId }">
                            <button type="button" class="btn btn-block {{(contentSubtype === quotationStatus.quotationStatusId) ? 'btn-secondary' : 'btn-primary'}}" (click)="onClickSelectQuotationStatus(quotationStatus.name)"><strong>{{contentTypeName | pluralNameFormat | uppercase}} {{quotationStatus.name | pluralNameFormat | uppercase}}</strong></button>
                        </a>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - LEAD TYPE -->
