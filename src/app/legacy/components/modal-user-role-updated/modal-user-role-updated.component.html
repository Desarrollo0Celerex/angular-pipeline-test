<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<!-- AGENTHOS - DETAILS CARD -->
				<h5 class="modal-title">Rol Actualizado</h5>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify"><strong>Los permisos de tu cuenta han cambiado</strong>.</p>
						<p class="text-justify">Un Administrador Global actualizó el rol de tu cuenta. <strong>Por favor confirma si deseas continuar.</strong></p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-block btn-primary" (click)="restartSession()"><strong>CONTINUAR</strong></button>
			</div>
		</div>
	</div>
</div>
