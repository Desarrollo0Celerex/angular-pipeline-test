<!-- AGENTHOS - APPLY PAYMENT -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <!-- AGENTHOS - POLICY NUMBER -->
                <h5 class="modal-title">Aplicar Pago</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <ng-container *ngIf="!!model.payment; else loadingContent">
                <form [formGroup]="model.paymentForm" (submit)="applyPayment()">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12">
                                <ol class="breadcrumb1">
                                    <li class="breadcrumb-item1">
                                        Selecciona el comprobante y los detalles
                                        del pago.
                                    </li>
                                </ol>
                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12">
                                <div
                                    class="form-group {{
                                        getValidationClass('file')
                                    }}"
                                >
                                    <!-- AGENTHOS - PAYTRACKER PAYMENT FILE -->
                                    <label class="form-label"
                                        >Comprobante de Pago</label
                                    >
                                    <input
                                        id="dropify"
                                        type="file"
                                        class="dropify"
                                        data-max-file-size="2M"
                                        (change)="onChangeFile($event)"
                                        data-height="208"
                                    />
                                    <div class="invalid-feedback">
                                        {{ getErrorMessage("file") }}
                                    </div>
                                </div>
                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12">
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <!-- AGENTHOS - PAYTRACKER PAYMENT DATE * -->
                                            <label class="form-label"
                                                >Fecha de Pago</label
                                            >
                                            <div class="input-group">
                                                <div
                                                    class="input-group-prepend"
                                                >
                                                    <div
                                                        class="input-group-text"
                                                    >
                                                        <i
                                                            class="fa fa-calendar-check-o tx-16 lh-0 op-6"
                                                        ></i>
                                                    </div>
                                                </div>
                                                <input
                                                    type="text"
                                                    [id]="
                                                        calendarIdApplicationDate
                                                    "
                                                    class="form-control fc-datepicker {{
                                                        getValidationClass(
                                                            'applicationDate'
                                                        )
                                                    }}"
                                                    formControlName="applicationDate"
                                                />
                                                <div class="invalid-feedback">
                                                    {{
                                                        getErrorMessage(
                                                            "applicationDate"
                                                        )
                                                    }}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <!-- AGENTHOS - PAYTRACKER PAYMENT AMOUNT * -->
                                            <label class="form-label"
                                                >Monto de Pago</label
                                            >
                                            <div class="input-group">
                                                <div
                                                    class="input-group-prepend"
                                                >
                                                    <div
                                                        class="input-group-text"
                                                    >
                                                        <i
                                                            class="fa fa-dollar tx-16 lh-0 op-6"
                                                        ></i>
                                                    </div>
                                                </div>
                                                <input
                                                    type="text"
                                                    class="form-control {{
                                                        getValidationClass(
                                                            'amount'
                                                        )
                                                    }}"
                                                    formControlName="amount"
                                                />
                                                <div class="invalid-feedback">
                                                    {{
                                                        getErrorMessage(
                                                            "amount"
                                                        )
                                                    }}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <!-- AGENTHOS - PAYTRACKER PAYMENT TYPE * -->
                                            <label class="form-label"
                                                >Forma de Pago</label
                                            >
                                            <div class="input-group">
                                                <div
                                                    class="input-group-prepend"
                                                >
                                                    <div
                                                        class="input-group-text"
                                                    >
                                                        <i
                                                            class="fa fa-tag tx-16 lh-0 op-6"
                                                        ></i>
                                                    </div>
                                                </div>
                                                <select
                                                    class="form-control {{
                                                        getValidationClass(
                                                            'paymentTypeId'
                                                        )
                                                    }}"
                                                    formControlName="paymentTypeId"
                                                >
                                                    <optgroup
                                                        label="Seleccionar Forma de Pago"
                                                    >
                                                        <option
                                                            *ngFor="
                                                                let paymentType of model.paymentTypes
                                                            "
                                                            [value]="
                                                                paymentType.paymentTypeId
                                                            "
                                                        >
                                                            {{
                                                                paymentType.name
                                                            }}
                                                        </option>
                                                    </optgroup>
                                                </select>
                                                <div class="invalid-feedback">
                                                    {{
                                                        getErrorMessage(
                                                            "paymentTypeId"
                                                        )
                                                    }}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <!-- AGENTHOS - PAYTRACKER PAYMENT REFERENCE * -->
                                            <label class="form-label"
                                                >Referencia de Pago</label
                                            >
                                            <div class="input-group">
                                                <div
                                                    class="input-group-prepend"
                                                >
                                                    <div
                                                        class="input-group-text"
                                                    >
                                                        <i
                                                            class="fa fa-dollar tx-16 lh-0 op-6"
                                                        ></i>
                                                    </div>
                                                </div>
                                                <input
                                                    type="text"
                                                    class="form-control {{
                                                        getValidationClass(
                                                            'paymentReference'
                                                        )
                                                    }}"
                                                    formControlName="paymentReference"
                                                />
                                                <div class="invalid-feedback">
                                                    {{
                                                        getErrorMessage(
                                                            "paymentReference"
                                                        )
                                                    }}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mt-3">
                                <button
                                    type="submit"
                                    class="btn btn-block agt-btn-default"
                                >
                                    🛰️ <strong>APLICAR PAGO</strong>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-secondary-outline"
                            data-dismiss="modal"
                        >
                            <strong>CANCELAR</strong>
                        </button>
                    </div>
                </form>
            </ng-container>
        </div>
    </div>
</div>

<ng-template #loadingContent>
    <agt-loading-content
        [isLoadingContent]="true"
        [height]="459"
    ></agt-loading-content>
</ng-template>

<ng-container *ngIf="!!model.payment">
    <agt-modal-notify-receipts-exceeded
        [modalId]="modalIdNotifyReceiptsExceeded"
        [contactId]="contactId"
        [policyId]="policyId"
        [paymentId]="paymentId"
        [receiptsExceeded]="receiptsExceeded"
        (actionConfirmed)="requestShowModalAgain()"
    >
    </agt-modal-notify-receipts-exceeded>

    <agt-modal-notify-missing-receipts
        [modalId]="modalIdNotifyMissingReceipts"
        [contactId]="contactId"
        [policyId]="policyId"
        [paymentId]="paymentId"
        [missingReceipts]="missingReceipts"
        (actionConfirmed)="requestShowModalAgain()"
    >
    </agt-modal-notify-missing-receipts>

    <agt-modal-notify-amount-exceeded
        [modalId]="modalIdNotifyAmountExceeded"
        [contactId]="contactId"
        [policyId]="policyId"
        [paymentId]="paymentId"
        [amountExceeded]="amountExceeded"
        [currencyName]="model.payment.currencyName"
        (actionConfirmed)="ignoreAmountExceeded()"
    >
    </agt-modal-notify-amount-exceeded>

    <agt-modal-notify-missing-amount
        [modalId]="modalIdNotifyMissingAmount"
        [contactId]="contactId"
        [policyId]="policyId"
        [paymentId]="paymentId"
        [missingAmount]="missingAmount"
        [currencyName]="model.payment.currencyName"
        (actionConfirmed)="ignoreMissingAmount()"
    >
    </agt-modal-notify-missing-amount>

    <agt-modal-select-evidence
        #modalSelectEvidence
        [modalId]="modalIdSelectPaymentEvidence"
        [data]="modalSelectEvidenceData"
        (fileSelected)="addPaymentEvidence($event)"
        (modalClosed)="showModalApplyPayment()"
    ></agt-modal-select-evidence>
</ng-container>

<agt-payment-applied-actions-modal></agt-payment-applied-actions-modal>
