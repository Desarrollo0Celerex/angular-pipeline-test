<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<!-- AGENTHOS - DETAILS CARD -->
				<h5 class="modal-title">Datos Extraidos</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12 text-center">
						<i class="fe fe-alert-triangle text-warning fa-5x"></i>
					</div>
					<div class="col-md-12 mt-5">
						<p class="text-center"><strong>Extracción de Datos Cruzados</strong></p>
						<p class="text-center">Hubo un error en la lectura de la póliza. Se analizó la póliza anterior para extraer los datos principales.</p>
						<ol class="breadcrumb1">
							<li class="breadcrumb-item1">Valida los detalles de la póliza manualmente para continuar.</li>
						</ol>
					</div>
				</div>	
			</div>
			<div class="modal-footer">
				<div class="col-md-12">
					<button type="button" class="btn btn-block btn-primary" data-dismiss="modal"><strong>VALIDAR DETALLES</strong></button>
				</div>
			</div>
		</div>
	</div>
</div>
