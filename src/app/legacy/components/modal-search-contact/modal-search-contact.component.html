<!-- AGENTHOS - CONTACT SEARCH -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Buscar Contacto</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">Ingresa el nombre de la persona o empresa.</li>
				</ol>
                <form [formGroup]="model.form" (submit)="searchContact()">
                    <div class="form-group">
                        <div class="row gutters-xs">
                            <div class="col">
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i class="fe fe-user tx-16 lh-0 op-6"></i>
                                        </div>
                                    </div>
                                    <input type="text" class="form-control {{getValidationClass('query')}}" placeholder="Ingresa el nombre del contacto" formControlName="query">
                                    <div class="invalid-feedback">{{getErrorMessage('query')}}</div>
                                </div>
                            </div>
                            <span class="col-auto">
                                <button type="submit" class="btn agt-btn-primary"><i class="fe fe-search"></i></button>
                            </span>
                        </div>
                    </div>
                </form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-block agt-btn-secondary-outline" data-dismiss="modal"><strong>CANCELAR</strong></button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - SINISTER POLICY SEARCH -->
