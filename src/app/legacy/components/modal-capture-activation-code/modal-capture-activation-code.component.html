<!-- AGENTHOS - WORKSPACE ACTIVATION CODE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
            <form [formGroup]="model.form" (submit)="activateWorkspace()">
                <div class="modal-header">
                    <h5 class="modal-title">Código de Activación</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1">Ingresa tu código de activación.</li>
                    </ol>
                    <div class="row">
                        <div class="col-md-12">
                            <p class="text-justify">Al contar con un código de activación podrás hacer uso de un plan de Agenthos sin costo. <strong>Por favor ingresa un código de activación para continuar</strong>.</p>
                            <div class="form-group">
                                <!-- AGENTHOS - WORKSPACE ACTIVATION CODE * -->
                                <label class="form-label">Código de Activación</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <i class="fe fe-shield tx-16 lh-0 op-6"></i>
                                        </div>
                                    </div>
                                    <input type="text" class="form-control {{getValidationClass('activationCode')}}" placeholder="Ingresa el código de activación." formControlName="activationCode">
                                    <div class="invalid-feedback">{{getErrorMessage('activationCode')}}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="col-md-12">
                        <button type="submit" class="btn btn-block agt-btn-primary"><strong>ACTIVAR CUENTA</strong></button>
                    </div>
                </div>
            </form>
		</div>
	</div>
</div>
<!-- //AGENTHOS - WORKSPACE ACTIVATION CODE -->
