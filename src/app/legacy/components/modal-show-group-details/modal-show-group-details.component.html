<!-- AGENTHOS - GROUPS DETAILS -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document" >
		<div class="modal-content">
			<div class="modal-header">
				<!-- AGENTHOS - CARD DETAILS -->
				<h5 class="modal-title">Detalles del Grupo</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body" *ngIf="!!group">
				<div class="row">
					<div class="col-md-12">
						<div class="row">
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Prima Total ({{group.currencyName}})</label>
									<input type="text" class="form-control" placeholder="{{group.totalGlobalWallet | currency: '': '$': '0.2-2'}}" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Prima Pagada</label>
									<input type="text" class="form-control" placeholder="{{group.totalGlobalWalletPaid | currency: '': '$': '0.2-2'}}" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Prima Pendiente</label>
									<input type="text" class="form-control" placeholder="{{walletPending | currency: '': '$': '0.2-2'}}" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Miembros Totales</label>
									<input type="text" class="form-control" [placeholder]="group.totalMembers" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Pólizas Totales</label>
									<input type="text" class="form-control" [placeholder]="group.totalActivePolicies" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Siniestros Totales</label>
									<input type="text" class="form-control" [placeholder]="group.totalOpenSinisters" readonly="">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="form-label">Fecha Registro</label>
									<input type="text" class="form-control" placeholder="{{group.createdAt | date: 'dd/MM/yyyy'}}" readonly="">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="form-label">Creador Grupo</label>
									<input type="text" class="form-control" placeholder="{{group.createdByName}}" readonly="">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer text-center">
				<div class="col-12">
					<button type="button" class="btn btn-block btn-primary" (click)="goToGroupMembers()"><strong>VER MIEMBROS</strong></button>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - GROUPS DETAILS -->
