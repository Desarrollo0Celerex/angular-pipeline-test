<!-- AGENTHOS - APP CREATOR SHARE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">{{title}}</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">{{description}}</li>
				</ol>
				<div class="row">
					<div class="col-md-12">
						<div class="form-group">
							<!-- AGENTHOS - APP CREATOR LINK -->
							<label class="form-label">{{subtitle}}:</label>
							<div class="row gutters-xs"> 
								<div class="col"> 
									<input type="text" class="form-control" [value]="link" disabled=""> 
								</div> 
								<span class="col-auto"> 
									<button type="button" class="btn agt-btn-primary" (click)="copyLink()"><i class="fe fe-copy"></i></button> 
								</span> 
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-block agt-btn-secondary-outline" data-dismiss="modal"><i class="fe fe-x-square mr-2"></i>CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - APP CREATOR SHARE -->
