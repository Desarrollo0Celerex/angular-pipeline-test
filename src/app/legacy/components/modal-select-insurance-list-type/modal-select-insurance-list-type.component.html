<!-- AGENTHOS - POLICY INSURANCE LIST -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Listado de Seguros</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">Selecciona el formato que deseas para el listado de seguros.</li>
				</ol>
				<div class="row">
					<div class="col-md-12 mt-3">
						<!-- AGENTHOS - INSURANCE GROUP VIEW -->
						<button type="button" class="btn btn-block btn-default" (click)="selectListType(INSURANCE_LIST_TYPES.BY_GROUP)">
                            <i class="fa fa-th mr-2"></i><strong>POR GRUPO DE SEGUROS</strong>
                        </button>
					</div>
					<div class="col-md-12 mt-3">
						<!-- AGENTHOS - INSURANCE CATEGORY VIEW -->
						<button type="button" class="btn btn-block btn-default" (click)="selectListType(INSURANCE_LIST_TYPES.BY_CATEGORY)">
                            <i class="fa fa-th-list mr-2"></i><strong>POR CATEGORÍA DE SEGUROS</strong>
                        </button>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - POLICY INSURANCE LIST -->
