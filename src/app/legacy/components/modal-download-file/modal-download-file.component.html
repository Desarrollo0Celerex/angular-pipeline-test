<!-- AGENTHOS - POLICY VIEW -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ !!data ? data.title : "" }}</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-8">
                        <p class="text-justify">
                            <strong>{{ !!data ? data.question : "" }}</strong>
                        </p>
                        <p class="text-justify">
                            {{ !!data ? data.description : "" }}
                        </p>
                        <p class="text-justify">
                            {{ !!data ? data.note : "" }}
                        </p>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group text-center">
                            <ng-container *ngIf="!!fileUrl">
                                <agt-qrcode [link]="fileUrl" />
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer text-center">
                <div class="col-12">
                    <a [href]="fileUrl" target="_blank">
                        <button
                            type="button"
                            class="btn btn-primary btn-block"
                            (click)="closeModal()"
                            [disabled]="!!!fileUrl"
                        >
                            <strong>{{
                                !!data ? (data.buttonLabel | uppercase) : ""
                            }}</strong>
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - POLICY VIEW -->
