<!-- AGENTHOS - POLICY REISSUE -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reexpedir Póliza</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <p class="text-justify">Para aplicar la reexpedición es necesario contar con la nueva póliza emitida. <strong>Por favor selecciona el tipo de reexpedición que deseas aplicar</strong>.</p>
                    </div>
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary btn-block mt-5" (click)="onClickReissuePolicyToSameClient()"><strong>MISMO CLIENTE</strong></button>
                    </div>
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary btn-block mt-5" (click)="onClickReissuePolicyToOtherClient()"><strong>CAMBIO DE CLIENTE</strong></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="col-md-12">
                    <button type="button" class="btn btn-block btn-secondary" data-dismiss="modal"><strong>CANCELAR</strong></button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - POLICY REISSUE -->
