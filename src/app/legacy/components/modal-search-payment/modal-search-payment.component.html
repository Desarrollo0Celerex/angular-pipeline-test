<!-- AGENTHOS - POLICY SEARCH -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{isNoResults ? 'Sin resultados' : 'Buscar Pago'}}</h5>
                <button type="button" class="close" aria-label="Close" (click)="closeModal()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="model.form" (submit)="searchPayment()">
                    <div class="form-group">
                        <div class="row gutters-xs">
                            <div class="col">
                                <input type="text" class="form-control {{getValidationClass('policyNumber')}}" formControlName="policyNumber" placeholder="Número de póliza">
                                <div class="invalid-feedback">{{getErrorMessage('policyNumber')}}</div>
                            </div>
                            <span class="col-auto">
                                <button type="submit" class="btn btn-primary"><i class="fe fe-search"></i></button>
                            </span>
                        </div>
                    </div>
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1" *ngIf="isNoResults; else showMessage"><strong>No hay pagos con los datos ingresados.</strong> Por favor verifica que los datos sean correctos o intenta con otro número de póliza.</li>
                        <ng-template #showMessage>
                            <li class="breadcrumb-item1">Ingresa la póliza a la que deseas aplicar el pago.</li>
                        </ng-template>
                    </ol>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-block btn-secondary" (click)="closeModal()"><strong>CANCELAR</strong></button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - POLICY SEARCH -->

<agt-modal-select-payment [modalId]="modalIdSelectPayment" [payments]="foundPayments" (paymentSelected)="selectPayment($event)"></agt-modal-select-payment>
