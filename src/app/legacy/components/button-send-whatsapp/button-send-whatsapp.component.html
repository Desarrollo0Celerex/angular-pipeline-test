<ng-container *ngIf="!!buttonSendWhatsappService.contact">
    <ng-container [ngSwitch]="buttonType">
        <ng-container *ngSwitchCase="BUTTON_TYPES.TEXT_WITH_ICON">
            <a href="{{(!!buttonSendWhatsappService.contact.phoneNumber) ? getLink() : ''}}" (click)="checkCanNavigate()" target="_blank">
                <button type="button" class="btn btn-block btn-lime mt-5" [disabled]="!(!!buttonSendWhatsappService.contact.phoneNumber) && required" (click)="onClickCheckConnection()">
                    <i class="fa fa-whatsapp mr-2"></i>
                    <strong>WHATSAPP</strong>
                </button>
            </a>
        </ng-container>
        <ng-container *ngSwitchCase="BUTTON_TYPES.INPUT">
            <div class="row gutters-xs">
                <div class="col">
                    <input type="text" class="form-control" placeholder="{{buttonSendWhatsappService.contact.phoneNumber | phoneNumberFormat: buttonSendWhatsappService.contact.phoneCode }}" readonly>
                </div>
                <span class="col-auto">
                    <a href="{{(!!buttonSendWhatsappService.contact.phoneNumber) ? getLink() : ''}}" (click)="checkCanNavigate()" target="_blank">
                        <button type="button" class="btn btn-lime" [disabled]="!(!!buttonSendWhatsappService.contact.phoneNumber) && required" (click)="onClickCheckConnection()">
                            <i class="fa fa-whatsapp"></i>
                        </button>
                    </a>
                </span>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="BUTTON_TYPES.ICON">
            <a href="{{(!!buttonSendWhatsappService.contact.phoneNumber) ? getLink() : ''}}" (click)="checkCanNavigate()" target="_blank">
                <button type="button" class="btn btn-icon btn-lime mr-5" [disabled]="!(!!buttonSendWhatsappService.contact.phoneNumber) && required" (click)="onClickCheckConnection()">
                    <i class="fa fa-whatsapp"></i>
                </button>
            </a>
        </ng-container>
    </ng-container>
</ng-container>
