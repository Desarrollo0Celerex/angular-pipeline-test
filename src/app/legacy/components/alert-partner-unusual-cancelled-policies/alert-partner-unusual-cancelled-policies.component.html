<div class="col-12" *ngIf="model.cancelledPoliciesRate > 0">
    <div class="alert alert-avatar alert-primary alert-dismissible mb-3">
        <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
        <strong>Business Intelligence</strong> <hr class="message-inner-separator">
        <agt-image-agenthos-assistant></agt-image-agenthos-assistant>
        <p><strong>Alerta:</strong> El socio tiene <strong>{{model.cancelledPoliciesRate}}%</strong> en rate de cancelación, mejora el proceso de emisión para evitar futuras cancelaciones.</p>
    </div>
</div>
