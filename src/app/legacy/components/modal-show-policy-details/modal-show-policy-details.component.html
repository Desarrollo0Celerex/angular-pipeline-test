<!-- AGENTHOS - POLICY DETAILS -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <!-- AGENTHOS - POLICY NUMBER -->
                <h5 class="modal-title">Detalles de Póliza</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- (JUST IF POLICY PENDING PAYMENTS) -->
					<div class="col-md-12 mb-3" *ngIf="totalPendingReceipts > 0">
                        <div class="alert alert-warning alert-dismissible fade show agt-cursor-pointer" role="alert" (click)="goToPendingReceipts()">
                            <span class="alert-inner--icon"><i class="fe fe-alert-circle"></i></span> 
                            <span class="alert-inner--text"> Póliza con <strong>{{totalPendingReceipts}}</strong> Recibo{{(totalPendingReceipts === 1) ? '' : 's'}} Pendiente{{(totalPendingReceipts === 1) ? '' : 's'}}.</span> 
                        </div>
					</div>
					<!-- //AGENTHOS - PENDING PAYMENTS  -->
					<!-- AGENTHOS - PENDING SINISTERS  -->
					<!-- (JUST IF POLICY PENDING SINISTERS) -->
					<div class="col-md-12 mb-3" *ngIf="totalOpenSinisters > 0">
						<div class="alert alert-warning alert-dismissible fade show agt-cursor-pointer" role="alert" (click)="goToPolicySinisters()">
                            <span class="alert-inner--icon"><i class="fe fe-alert-circle"></i></span> 
                            <span class="alert-inner--text"> Póliza con <strong>{{totalOpenSinisters}}</strong> Siniestro{{(totalOpenSinisters === 1) ? '' : 's'}} Abierto{{(totalOpenSinisters === 1) ? '' : 's'}}.</span>
                        </div>
					</div>
					<!-- AGENTHOS - PENDING SINISTERS  -->
                <div class="row">
                    <div class="col-md-12">
                        <div class="row">
                            <div class="col-md-6">
								<div class="form-group">
									<label class="form-label">Titular</label>
									<input type="text" class="form-control" [placeholder]="model.policyDetails.titularName" readonly="">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="form-label">No. Póliza</label>
									<input type="text" class="form-control" [placeholder]="model.policyDetails.policyNumber" readonly="">
								</div>
							</div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Prima Total</label>
                                    <input type="text" class="form-control" [placeholder]="model.policyDetails.totalAmount | currency: '' : '$' : '0.2-2'" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Prima Pagada</label>
                                    <input type="text" class="form-control" [placeholder]="model.policyDetails.totalAmountPaid | currency: '' : '$' : '0.2-2'" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Recibos Pagados</label>
                                    <input type="text" class="form-control" placeholder="{{model.policyDetails.totalTickets}} de {{model.policyDetails.totalBills}}" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Fecha Emisión</label>
                                    <input type="text" class="form-control" [placeholder]="(!!model.policyDetails.emissionDate) ? (model.policyDetails.emissionDate | date: 'dd/MM/yyyy') : ''" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Inicio Vigencia</label>
                                    <input type="text" class="form-control" [placeholder]="(!!model.policyDetails.validityStartDate) ? (model.policyDetails.validityStartDate | date: 'dd/MM/yyyy') : ''" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Fin Vigencia</label>
                                    <input type="text" class="form-control" [placeholder]="(!!model.policyDetails.validityEndDate) ? (model.policyDetails.validityEndDate | date: 'dd/MM/yyyy') : ''" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Siniestros</label>
                                    <input type="text" class="form-control" [placeholder]="model.policyDetails.totalSinisters" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label class="form-label">Endosos</label>
                                    <input type="text" class="form-control" [placeholder]="model.policyDetails.totalEndorsements" readonly="">
                                </div>
                            </div>
                            <div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Renovaciones</label>
									<input type="text" class="form-control" [placeholder]="model.policyDetails.totalRenewals" readonly="">
								</div>
							</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer text-center">
                <div class="col-12">
                    <button type="button" class="btn btn-primary btn-block" (click)="goToPolicyRecord()"><strong>VER HISTORIAL</strong></button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - POLICY DETAILS -->
