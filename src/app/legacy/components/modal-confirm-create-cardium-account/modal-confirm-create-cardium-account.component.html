<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Crear Tarjeta Digital</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify"><strong>¿Aún no tienes tarjeta digital de Cardium?</strong></p>
						<p class="text-justify">Agenthos te ayudará a crear una tarjeta digital de Cardium. <strong>Por favor crea una tarjeta digital de Cardium para continuar</strong>.</p>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<div class="col-md-12">
					<a href="https://cardium.io" target="_blank">
					    <button type="button" class="btn btn-block agt-btn-primary" (click)="closeModal()"><strong>CREAR TARJETA DIGITAL DE CARDIUM</strong></button>
                    </a>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - SOCIAL CONNECT NEW CARDIUM -->
