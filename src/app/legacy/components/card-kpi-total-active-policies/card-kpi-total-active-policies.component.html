<div class="card">
    <div class="card-body text-center">
        <i class="fa fa-pie-chart text-primary fa-3x"></i>
        <h6 class="mt-4 mb-2">Pólizas Activas</h6>
        <h2 class="number-font"><span class="counter">{{model.totalActivePolicies}}</span></h2>
    </div>
    <div class="card-footer text-center">
        <button type="button" class="btn btn-block btn-secondary" (click)="uploadPolicy()"><strong>CARGAR PÓLIZA</strong></button>
        <button type="button" class="btn btn-block btn-primary mt-3" (click)="goToListActivePoliciesByRange()"><strong>VER PÓLIZAS</strong></button>
    </div>
</div>
