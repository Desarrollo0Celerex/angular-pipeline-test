<!-- AGENTHOS - SINISTER DETAILS -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content" *ngIf="!!model.sinister">
			<div class="modal-header">
				<h5 class="modal-title">Detalles de Siniestro</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<!-- AGENTHOS - POLICY OWNER -->
									<label class="form-label">Titular</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.titularName" readonly="">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<!-- AGENTHOS - SINISTER TYPE -->
									<label class="form-label">No. Póliza</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.policyNumber" readonly="">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="form-label">Ejecutivo Asignado</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.manager" readonly="">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label class="form-label">No. Reporte</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.internalNumber" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<!-- AGENTHOS - SINISTER NUMBER -->
									<label class="form-label">No. Siniestro</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.sinisterNumber" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<!-- AGENTHOS - SINISTER INVOICE -->
									<label class="form-label">No. Folio</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.invoice" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<!-- AGENTHOS - SINISTER CERTIFICATE -->
									<label class="form-label">No. Certificado</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.certificate" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<!-- AGENTHOS - SINISTER DATE -->
									<label class="form-label">Fecha Siniestro</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.sinisterDate" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<!-- AGENTHOS - SINISTER DATE -->
									<label class="form-label">Fecha Estimación</label>
									<input type="text" class="form-control" [placeholder]="model.sinister.estimatedResolutionDate" readonly="">
								</div>
							</div>
							<div class="col-md-4">
								<div class="form-group">
									<label class="form-label">Estado Siniestro</label>
									<input type="text" class="form-control" [placeholder]="sinisterStatus" readonly="">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer text-center">
				<div class="col-12">
					<button type="button" class="btn btn-block btn-primary" (click)="onclickGoToEvents()"><strong>VER EVENTOS</strong></button>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - SINISTER DETAILS -->
