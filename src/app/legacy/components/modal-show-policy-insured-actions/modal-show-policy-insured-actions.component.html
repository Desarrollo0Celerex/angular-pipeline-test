<!-- AGENTHOS - POLICY GROUP ACTIONS -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Acciones Disponibles</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">Selecciona la acción que deseas realizar.</li>
				</ol>
				<div class="row">
					<div class="col-md-12 mt-3">
						<!-- AGENTHOS - POLICY NEW CERTIFICATE -->
						<button type="button" class="btn btn-block btn-default" (click)="_selectPolicyInsuredUploadType()"><i class="fa fa-file-text mr-2"></i><strong>CARGAR CERTIFICADOS</strong></button>
					</div>
					<div class="col-md-6 mt-3">
						<!-- AGENTHOS - POLICY DOWNLOAD REPORT -->
						<button type="button" class="btn btn-block btn-default" (click)="_selectReportFormatType()"><i class="fa fa-cloud-download mr-2"></i><strong>GENERAR REPORTE</strong></button>
					</div>
					<div class="col-md-6 mt-3">
						<!-- AGENTHOS - POLICY RECORD -->
						<button type="button" class="btn btn-block btn-default" (click)="goToPolicyHistory()"><i class="fa fa-history mr-2"></i><strong>VER HISTORIAL</strong></button>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">CANCELAR</button>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - POLICY GROUP ACTIONS -->
