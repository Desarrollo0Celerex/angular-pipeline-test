<!-- AGENTHOS - POLICY LINKER -->
<div class="modal fade" [id]="modalId" tabindex="-1" role="dialog"  aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Enlazar Póliza</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12">
						<p class="text-justify">Para aplicar un enlace de póliza es necesario contar con el formato digital. <strong>Por favor selecciona el tipo de enlace que deseas aplicar</strong>.</p>
					</div>
					<div class="col-md-12">
						<button type="button" class="btn btn-primary btn-block mt-5" (click)="createPolicy()"><strong>HISTORIAL</strong></button>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<div class="col-md-12">
					<button type="button" class="btn btn-block btn-secondary" data-dismiss="modal"><strong>CANCELAR</strong></button>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- //AGENTHOS - POLICY LINKER -->
