<!-- AGENTHOS - SUPPORT -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Acciones Disponibles</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ol class="breadcrumb1">
                    <li class="breadcrumb-item1">
                        Selecciona la acción que deseas realizar.
                    </li>
                </ol>
                <div class="row">
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - SUPPORT TRAINING -->
                        <a href="https://agenthos.com/training" target="_blank">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                (click)="closeModal()"
                            >
                                🗓️ <strong>AGENDAR CAPACITACIÓN</strong>
                            </button>
                        </a>
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SUPPORT BUG -->
                        <a
                            href="https://wa.me/{{
                                agenthosSupportPhone
                            }}?text=Hola, mi nombre es {{
                                model.username
                            }} de parte de {{
                                model.workspaceName
                            }} y quiero reportar un error en mi cuenta de Agenthos."
                            target="_blank"
                        >
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                (click)="closeModal()"
                            >
                                👾 <strong>REPORTAR BUG</strong>
                            </button></a
                        >
                    </div>
                    <div class="col-md-6 mt-3">
                        <!-- AGENTHOS - SUPPORT IDEA -->
                        <a
                            href="https://wa.me/{{
                                agenthosSupportPhone
                            }}?text=Hola, mi nombre es {{
                                model.username
                            }} de parte de {{
                                model.workspaceName
                            }} y quiero solicitar una mejora en mi cuenta de Agenthos."
                            target="_blank"
                        >
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                (click)="closeModal()"
                            >
                                💡 <strong>SOLICITAR MEJORA</strong>
                            </button></a
                        >
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    CANCELAR
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - SUPPORT -->
