<!-- AGENTHOS - KPIS -->
<div class="row">
    <div
        class="col-xl-3 col-lg-6 col-md-6 col-sm-12"
        *ngFor="let kpi of contentKpisService.kpis"
    >
        <div class="card">
            <div class="card-header border-bottom-0">
                <!-- AGENTHOS - ACTIVE TAB -->
                <h6 class="mb-0">
                    {{ contentTypeName | plural }}<br />{{ kpi.name | plural }}
                </h6>
                <div
                    class="card-options"
                >
                    <a
                        routerLink="{{ !!pageUrl ? pageUrl : '.' }}"
                        [queryParams]="{ contentSubtype: kpi.contentSubtype }"
                    >
                        <button class="btn btn-sm" [ngClass]="contentSubtype === kpi.contentSubtype ? 'agt-btn-secondary-outline no-focus' : 'agt-btn-secondary'">
                            <i class="fe fe-check-circle mr-2"></i>VER
                        </button>
                    </a>
                </div>
            </div>
            <div class="card-body d-flex pt-1 pb-1">
                <div class="text-left">
                    <h4 class="mb-1">
                        <span class="number-font"
                            ><span class="counter">{{ kpi.total }}</span></span
                        >
                    </h4>
                    <p class="text-muted mb-1">
                        <span class="agt-text-success fs-13"
                            >({{ kpi.percentage | percent }})</span
                        >Sobre el Total
                    </p>
                </div>
                <div class="ml-auto">
                    <div class="feature">
                        <div
                            class="fa-stack fa-lg fa-2x icon bg-{{
                                kpi.background
                            }} icon-service"
                        >
                            <i
                                class="mdi {{
                                    kpi.icon
                                }} fa-stack-1x text-white"
                            ></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
