<!-- AGENTHOS - QUOTE LAUNCHER -->
<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ title }}</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ol class="breadcrumb1">
                    <li class="breadcrumb-item1">{{ description }}</li>
                </ol>
                <div class="row">
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - CONTACT LEAD CREATOR -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="doActionCreateContact()"
                        >
                            📇 <strong>PROSPECTO NUEVO</strong>
                        </button>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - POLICY NEW CERTIFICATE -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="doActionSearchContact()"
                        >
                            🗄️ <strong>CLIENTE ACTUAL</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <!-- AGENTHOS - CANCEL QUOTE -->
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    CANCELAR
                </button>
            </div>
        </div>
    </div>
</div>
<!-- //AGENTHOS - QUOTE LAUNCHER -->
