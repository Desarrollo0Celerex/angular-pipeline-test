<div class="row mb-3">
	<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
		<div class="card">
			<div class="card-body">
				<h3 class="card-title">Indicadores de Socios Comerciales</h3>
			</div>
		</div>
	</div>
	<ng-container *ngIf="model.kpis.length > 0; else emptyContent">
		<div class="col-xl-6 col-lg-6 col-md-12 col-sm-12" *ngFor="let kpi of model.kpis">
	        <agt-card-kpi-two [kpi]="kpi"></agt-card-kpi-two>
		</div>
	</ng-container>
</div>

<ng-template #emptyContent>
	<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
		<div class="card">
			<div class="card-body">
				<ol class="breadcrumb1">
					<li class="breadcrumb-item1">Ningún socio comercial generó cotizaciones en el periodo seleccionado. <strong>Selecciona otro periodo para ver los indicadores</strong>.</li>
				</ol>
			</div>
		</div>
	</div>
</ng-template>
