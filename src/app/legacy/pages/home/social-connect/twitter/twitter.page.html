<form *ngIf="model.isBuiltForm; else loadingContent" [formGroup]="model.form" (submit)="showModalToConfirmUpdateSocialConnect()">        
    <!-- AGENTHOS - SOCIAL CONNECT CHANNEL -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Conectar Twitter</h3>
        </div>
        <div class="card-body">
            <ol class="breadcrumb1">
                <li class="breadcrumb-item1">Ingresa el link completo de tu perfil de Twitter.</li>
            </ol>
            <div class="row">
                <!-- AGENTHOS - SOCIAL CONNECT -->
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                    <div class="form-group">
                        <!-- AGENTHOS - SOCIAL CONNECT Twitter * -->
                        <label class="form-label">Twitter</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <div class="input-group-text">
                                    <i class="fe fe-twitter tx-16 lh-0 op-6"></i>
                                </div>
                            </div>
                            <!-- AGENTHOS - DATA VALIDATION -->
                            <!-- (https://Twitter.com/) -->
                            <input type="text" class="form-control {{getValidationClass('twitterUrl')}}" placeholder="https://twitter.com/agenthosbrokers" formControlName="twitterUrl">
                            <div class="invalid-feedback">{{getErrorMessage('twitterUrl')}}</div>
                        </div>
                        <a href="javascript://" (click)="showModalToConfirmCreateTwitterAccount()">
                        <p class="mt-3 text-center"><strong>Aún no cuento con perfil de Twitter</strong></p></a>
                    </div>
                </div>
                <!-- //AGENTHOS - SOCIAL CONNECT -->

                <!-- AGENTHOS - SOCIAL CONNECT DETAILS -->
                <div class="col-md-12 mt-5">
                    <div class="card shadow">
                        <div class="card-body">
                            Agenthos usará este link para conectar tu perfil de Twitter dentro de tu app, sitio web y todos tus canales digitales.
                        </div>
                    </div>
                </div>
                <!-- //AGENTHOS - SOCIAL CONNECT DETAILS -->

            </div>
            <!-- //AGENTHOS - APP CREATOR NAME -->
        </div>
    </div>
    <!-- //AGENTHOS - SOCIAL CONNECT CHANNEL -->

    <!-- AGENTHOS - SOCIAL CONNECT UPDATE -->
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-12">
                    <button type="submit" class="btn btn-block agt-btn-primary"><strong>GUARDAR CAMBIOS</strong></button>
                </div>
            </div>
        </div>
    </div>
    <!-- //AGENTHOS - SOCIAL CONNECT UPDATE -->
</form>

<ng-template #loadingContent>
    <agt-loading-content [isLoadingContent]="true" ></agt-loading-content>
</ng-template>

<agt-modal-confirm-create-twitter-account
    [modalId]="modalIdConfirmCreateTwitterAccount"
></agt-modal-confirm-create-twitter-account>

<agt-modal-confirm-update-social-connect
    [modalId]="modalIdConfirmUpdateSocialConnect"
    (actionConfirmed)="updateSocialConnect()"
></agt-modal-confirm-update-social-connect>
