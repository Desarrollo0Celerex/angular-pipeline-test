<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Pólizas Cargadas (Últimos 8 días)</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive mb-0">
                    <table class="table border table-bordered text-nowrap mb-0">
                        <thead>
                            <tr>
                                <th>NO.</th>
                                <th>WORKSPACE</th>
                                <th>CONTRATANTE</th>
                                <th>ASEGURADORA</th>
                                <th>SEGURO</th>
                                <th>PÓLIZA</th>
                                <th>ENVIAR</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                                *ngFor="let policy of policies; let index = index"
                            >
                                <td>{{index + 1}}</td>
                                <td>{{policy.workspaceName}}</td>
                                <td>{{policy.titularName}}</td>
                                <td>{{policy.insurerName | uppercase}}</td>
                                <td>{{policy.insuranceName | uppercase}}</td>
                                <td>{{policy.policyNumber}}</td>
                                <td>
                                    <button
                                        *ngIf="policy.titularPhoneNumber"
                                        type="button"
                                        class="btn btn-success btn-sm mb-1"
                                        (click)="sendMessage(policy)"
                                    >
                                        ENVIAR PÓLIZA
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <!-- COL END -->
</div>
