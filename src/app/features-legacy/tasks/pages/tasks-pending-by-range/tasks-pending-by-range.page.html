<div class="row">
    <div class="col-12">
        <agt-card-content-title
            title="Tareas Pendientes"
            description="Tareas que aún no se han iniciado."
        ></agt-card-content-title>
    </div>
</div>

<!-- AGENTHOS - LISTING FILTERS  -->
<div class="row mt-3">
    <!-- AGENTHOS - DATA SUITE STATS -->
    <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12">
        <!-- AGENTHOS - PERIOD FILTERS -->
        <agt-container-select-stats-period
            [statsPeriodData]="statsPeriodData"
            [canShowComparisonPeriod]="false"
            (statsPeriodSelected)="loadContent($event)"
        >
        </agt-container-select-stats-period>
        <!-- //AGENTHOS - PERIOD FILTERS -->
    </div>
    <!-- //AGENTHOS - DATA SUITE STATS -->
    <!-- AGENTHOS - DATA SUITE REPORT -->
    <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12">
        <agt-card-report-pending-tasks
            *ngIf="!!statsPeriodData"
            [filters]="filters"
            [rangeField]="rangeField"
            [rangeStart]="statsPeriodData.startDate"
            [rangeEnd]="statsPeriodData.endDate"
            [specialFilter]="specialFilter"
        />
    </div>
    <!-- //AGENTHOS - DATA SUITE REPORT -->
</div>
<!-- //AGENTHOS - LISTING FILTERS  -->

<div class="row mt-3">
    <div class="col-12">
        <agt-card-content-title title="Tareas Pendientes" />
    </div>
</div>

<agt-tasks-list
    *ngIf="!!statsPeriodData"
    subcontentName="Pendiente"
    noResultsMessage="No se encontraron tareas pendientes."
    noResultsMessage="Por favor programa una tarea para darle seguimiento."
    noResultsButtonLabel="Programar Tarea"
    [filters]="filters"
    [rangeField]="rangeField"
    [rangeStart]="statsPeriodData.startDate"
    [rangeEnd]="statsPeriodData.endDate"
    [specialFilter]="specialFilter"
    [sortBy]="sortBy"
/>
