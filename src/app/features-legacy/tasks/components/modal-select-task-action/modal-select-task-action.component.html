<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Acciones Disponibles</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ol class="breadcrumb1">
                    <li class="breadcrumb-item1">
                        Selecciona la acción que deseas realizar.
                    </li>
                </ol>
                <div class="row">
                    <div class="col-md-12 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            data-dismiss="modal"
                            (click)="showModalCreateTask()"
                        >
                            <i class="fa fa-calendar-plus-o mr-2"></i
                            ><strong>PROGRAMAR TAREA</strong>
                        </button>
                    </div>
                    <div class="col-md-12 mt-3">
                        <a [routerLink]="tasksFinishedByRangeRoute">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                data-dismiss="modal"
                            >
                                <i class="fa fa-check-square-o mr-2"></i
                                ><strong>VER TAREAS TERMINADAS</strong>
                            </button>
                        </a>
                    </div>
                    <div class="col-md-12 mt-3">
                        <a [routerLink]="tasksInProgressByRangeRoute">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                data-dismiss="modal"
                            >
                                <i class="fa fa-spinner mr-2"></i
                                ><strong>VER TAREAS EN PROGRESO</strong>
                            </button>
                        </a>
                    </div>
                    <div class="col-md-12 mt-3">
                        <a [routerLink]="tasksPendingByRangeRoute">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                data-dismiss="modal"
                            >
                                <i class="fa fa-tasks mr-2"></i
                                ><strong>VER TAREAS PENDIENTES</strong>
                            </button>
                        </a>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
