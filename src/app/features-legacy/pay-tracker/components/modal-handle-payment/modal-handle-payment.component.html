<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Gestionar Pago</h5>
                <button
                    type="button"
                    class="close"
                    aria-label="Close"
                    (click)="closeModal()"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-12 mb-3" *ngIf="canShowAlert">
                        <agt-alert [message]="alertMessage"></agt-alert>
                    </div>
                    <div class="col-md-12">
                        <ol class="breadcrumb1">
                            <li class="breadcrumb-item1">
                                Selecciona la acción que deseas realizar.
                            </li>
                        </ol>
                    </div>
                    <div class="col-md-12 mt-3">
                        <!-- AGENTHOS - PAYTRACKER PAYMENT APPLY -->
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="requestApplyPayment()"
                        >
                            💸 <strong>APLICAR PAGO</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="showModalCreateComment()"
                        >
                            🧾 <strong>AGREGAR NOTA</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="showModalDownloadPolicy()"
                        >
                            📄 <strong>DESCARGAR PÓLIZA</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="requestSendReminder()"
                        >
                            🔔 <strong>ENVIAR RECORDATORIO</strong>
                        </button>
                    </div>
                    <div class="col-md-6 mt-3">
                        <button
                            type="button"
                            class="btn btn-block agt-btn-default"
                            (click)="showModalCreateTask()"
                        >
                            📆 <strong>AGENDAR SEGUIMIENTO</strong>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    (click)="closeModal()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>

<agt-modal-create-payment-comment
    (commentAdded)="commentAdded()"
></agt-modal-create-payment-comment>

<agt-send-payment-reminder
    (reminderSent)="showAlertReminderSent()"
></agt-send-payment-reminder>
<agt-modal-show-policy-file
    [modalId]="modalIdDownloadPolicy"
    [contactId]="contactId"
    [policyId]="policyId"
></agt-modal-show-policy-file>
