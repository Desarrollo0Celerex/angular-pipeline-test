<!-- AGENTHOS TOP VIEW -->
<div class="page-header">
    <div class="media mb-3">
        <!-- AGENTHOS - AGENTE LOGO -->
        <img
            class="avatar-lg rounded-circle mr-3"
            [src]="workspace?.avatarUrl"
        />
        <div class="media-body">
            <div class="d-flex align-items-center">
                <div class="mt-1">
                    <!-- AGENTHOS - AGENTE NOMBRE -->
                    <h5 class="mb-0">{{ workspace?.brandName }}</h5>
                    <!-- AGENTHOS - ID AGENTE -->
                    <p class="mb-0 fs-13 text-muted">
                        ID: {{ workspaceUser?.shortName }}
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div class="ml-auto">
        <button
            type="button"
            class="btn btn-block agt-btn-success-light agt-pulse-success"
            (click)="showModalWorkspaceQuickActions()"
        >
            <i class="fe fe-activity mr-2"></i>
            <strong>ASISTENTE</strong>
        </button>
    </div>
</div>
<!-- AGENTHOS TOP VIEW END -->

<agt-workspace-quick-actions-modal></agt-workspace-quick-actions-modal>
