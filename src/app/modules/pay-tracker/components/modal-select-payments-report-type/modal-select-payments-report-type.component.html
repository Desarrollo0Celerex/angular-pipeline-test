<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Generar Reporte</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ol class="breadcrumb1">
                    <li class="breadcrumb-item1">
                        Selecciona el tipo de reporte que deseas generar.
                    </li>
                </ol>
                <div class="row">
                    <div class="col-md-12 mt-3">
                        <a [routerLink]="receiptsPaidLink">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                (click)="closeModal()"
                            >
                                <i class="fa fa-calendar-check-o mr-2"></i
                                ><strong>RECIBOS PAGADOS</strong>
                            </button>
                        </a>
                    </div>
                    <div class="col-md-12 mt-3">
                        <a [routerLink]="receiptsPendingLink">
                            <button
                                type="button"
                                class="btn btn-block agt-btn-default"
                                (click)="closeModal()"
                            >
                                <i class="fa fa-calendar-minus-o mr-2"></i
                                ><strong>RECIBOS PENDIENTES</strong>
                            </button></a
                        >
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    data-dismiss="modal"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
