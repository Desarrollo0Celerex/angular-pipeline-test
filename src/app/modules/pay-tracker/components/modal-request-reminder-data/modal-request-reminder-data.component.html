<div
    class="modal fade"
    [id]="modalId"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Recordatorio de Pago</h5>
                <button
                    type="button"
                    class="close"
                    aria-label="Close"
                    (click)="closeModal()"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="form" (submit)="validateForm()">
                    <ol class="breadcrumb1">
                        <li class="breadcrumb-item1">
                            Ingresa los datos para enviar el recordatorio de
                            pago.
                        </li>
                    </ol>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <ng-container *ngIf="isFormBuilt">
                                    <ng-container *ngIf="canRequestEmail">
                                        <label class="form-label">Correo</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <div class="input-group-text">
                                                    <i
                                                        class="fa fa-envelope-o tx-16 lh-0 op-6"
                                                    ></i>
                                                </div>
                                            </div>
                                            <input
                                                type="text"
                                                class="form-control {{
                                                    getValidationClass(
                                                        'titularEmail'
                                                    )
                                                }}"
                                                placeholder="Ingresa el correo del asegurado"
                                                formControlName="titularEmail"
                                            />
                                            <div class="invalid-feedback">
                                                {{
                                                    getErrorMessage(
                                                        "titularEmail"
                                                    )
                                                }}
                                            </div>
                                        </div>
                                    </ng-container>
                                    <ng-container *ngIf="canRequestPhoneNumber">
                                        <label class="form-label"
                                            >WhatsApp</label
                                        >
                                        <div class="input-group">
                                            <agt-dropdown-select-phone-code
                                                [phoneCodeId]="
                                                    form.controls
                                                        .titularPhoneCodeId
                                                        .value
                                                "
                                                (phoneCodeIdSelected)="
                                                    updatePhoneCodeId($event)
                                                "
                                            ></agt-dropdown-select-phone-code>
                                            <input
                                                type="text"
                                                class="form-control {{
                                                    getValidationClass(
                                                        'titularPhoneNumber'
                                                    )
                                                }}"
                                                placeholder="Ingresa el teléfono del asegurado"
                                                formControlName="titularPhoneNumber"
                                            />
                                            <div class="invalid-feedback">
                                                {{
                                                    getErrorMessage(
                                                        "titularPhoneNumber"
                                                    )
                                                }}
                                            </div>
                                        </div>
                                    </ng-container>
                                </ng-container>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-3">
                            <button
                                type="submit"
                                class="btn btn-block agt-btn-default"
                            >
                                <i class="fa fa-send mr-2"></i
                                ><strong>ENVIAR RECORDATORIO</strong>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-block agt-btn-secondary-outline"
                    (click)="closeModal()"
                >
                    <strong>CANCELAR</strong>
                </button>
            </div>
        </div>
    </div>
</div>
