<agt-payments-kpis></agt-payments-kpis>

<div class="row mt-5">
    <div class="col-xl-9 col-lg-6 col-md-6 col-sm-12">
        <agt-search-engine></agt-search-engine>
    </div>
    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
        <agt-payments-main-action
            (loadPolicy)="showModalToSelectContactAction()"
        ></agt-payments-main-action>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12">
        <agt-payments-title></agt-payments-title>
    </div>
</div>

<agt-workspace-payment-list
    (loadPolicy)="showModalToSelectContactAction()"
></agt-workspace-payment-list>

<!-- TODO: REFACTORIZE -->
<agt-modal-select-contact-action
    [modalId]="modalIdSelectContactAction"
    title="Cargar Póliza"
    description="Selecciona a quién le deseas cargar la póliza."
    (createContact)="showModalToSelectContactType()"
    (searchContact)="showModalToSearchContact()"
></agt-modal-select-contact-action>
<agt-modal-select-contact-type
    [modalId]="modalIdSelectContactType"
    title="Crear Prospecto"
    description="Selecciona el tipo de prospecto que deseas crear."
></agt-modal-select-contact-type>
<agt-modal-search-contact
    [modalId]="modalIdSearchContact"
    [actionType]="2"
></agt-modal-search-contact>
