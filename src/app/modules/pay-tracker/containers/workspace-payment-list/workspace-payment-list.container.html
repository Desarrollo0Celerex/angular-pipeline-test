<agt-payment-list
    contentName="{{contentType | contentTypeName | plural: payments.length}} {{paymentStatusId | paymentStatusName | plural: payments.length}}"
    noResultsMessage="No se encontraron {{contentType | contentTypeName | plural}} {{paymentStatusId | paymentStatusName | plural: payments.length}}."
    noResultsDetails="Por favor carga una póliza para detectar sus {{contentType | contentTypeName | plural}}."
    [canShowNoResultsAction]="true"
    [isLoadedContent]="isLoadedContent"
    [isLoadingContent]="isLoadingContent"
    [payments]="payments"
    [totalItems]="totalItems"
    (loadMoreContents)="loadMoreContents()"
></agt-payment-list>
