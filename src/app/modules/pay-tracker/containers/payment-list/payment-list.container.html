<ng-container *ngIf="isLoadedContent">
    <ng-container *ngIf="hasResults; else noResultsContainer">
        <div class="row">
            <ng-container *ngFor="let payment of payments">
                <div class="col-xl-4 col-lg-6 col-md-6 col-sm-12">
                    <agt-card-payment [payment]="payment"></agt-card-payment>
                </div>
            </ng-container>
        </div>
    </ng-container>
</ng-container>

<div class="row">
    <div class="col-sm-12">
        <agt-loading-content
            [isLoadingContent]="isLoadingContent"
        ></agt-loading-content>
        <ng-container *ngIf="hasResults">
            <agt-card-content-results
                contentName="{{ contentType | contentTypeName | plural: totalItemsLoaded}} {{paymentStatusId | paymentStatusName | plural: totalItemsLoaded}}"
                [isLoadingContent]="isLoadingContent"
                [totalItems]="totalItems"
                [totalItemsLoaded]="totalItemsLoaded"
                (loadMoreContents)="loadMoreContents()"
            ></agt-card-content-results>
        </ng-container>
    </div>
</div>

<ng-template #noResultsContainer>
    <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
            <agt-card-content-no-results
                message="No se encontraron {{contentType | contentTypeName | plural}} pendientes"
                details="Por favor carga una póliza para detectar sus {{contentType | contentTypeName | plural}}"
                (doAction)="showModalToSelectContactAction()"
            ></agt-card-content-no-results>
        </div>
    </div>
</ng-template>
